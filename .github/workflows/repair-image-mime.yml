name: Repair Wiener IA image MIME

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair image output MIME
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('mime_type:"image/png"', 'mime_type:"image/jpeg"')
          s = s.replace('data:image/png;base64,${result.data}', 'data:image/jpeg;base64,${result.data}')
          if s == old:
              print('No image MIME repair needed.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Image MIME repaired.')
          PY

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: use JPEG for Gemini image output'
          git push
