name: Wiener-IA Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Install TypeScript build dependencies
        working-directory: frontend
        run: npm install --no-save --save-dev @types/react @types/react-dom @types/node@20.17.6 typescript@5.8.2
      - name: Build static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_WIENER_API_URL: ${{ vars.WIENER_API_URL }}
          NEXT_PUBLIC_BASE_PATH: /Wiener-IA
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
