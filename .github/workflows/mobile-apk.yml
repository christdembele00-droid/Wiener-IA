name: Build Wiener IA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'App.js'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - '.github/workflows/mobile-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Expo and EAS CLI
        run: npm install --global eas-cli@latest

      - name: Validate Expo token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi
          CLEAN_TOKEN="$(printf '%s' "$EXPO_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CLEAN_TOKEN"
          echo "EXPO_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"

      - name: Verify EAS authentication
        run: eas whoami

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: npx expo config --type public

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --no-wait
