name: Validate Wiener IA Mobile

on:
  push:
    paths:
      - 'App.js'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'App.js'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - '.github/workflows/mobile-check.yml'

jobs:
  expo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Expo config check
        run: npx expo config --type public
