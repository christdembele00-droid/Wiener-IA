name: Deploy Wiener IA Firebase Serverless

on:
  workflow_dispatch:
  push:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/firebase-deploy.yml'

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Create Firebase service account file
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Create temporary secret files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIENER_FIREBASE_WEB_API_KEY: ${{ secrets.WIENER_FIREBASE_WEB_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$WIENER_FIREBASE_WEB_API_KEY"
          test -n "$CLOUDINARY_URL"
          printf '%s' "$GEMINI_API_KEY" > "$RUNNER_TEMP/gemini-api-key"
          printf '%s' "$WIENER_FIREBASE_WEB_API_KEY" > "$RUNNER_TEMP/firebase-web-api-key"
          printf '%s' "$CLOUDINARY_URL" > "$RUNNER_TEMP/cloudinary-url"

      - name: Sync Firebase Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase functions:secrets:set GEMINI_API_KEY --project weiner-ia --data-file "$RUNNER_TEMP/gemini-api-key"
          firebase functions:secrets:set WIENER_FIREBASE_WEB_API_KEY --project weiner-ia --data-file "$RUNNER_TEMP/firebase-web-api-key"
          firebase functions:secrets:set CLOUDINARY_URL --project weiner-ia --data-file "$RUNNER_TEMP/cloudinary-url"

      - name: Deploy Functions and Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --project weiner-ia --only functions,firestore:rules,firestore:indexes --non-interactive

      - name: Cleanup credentials and temporary secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
          rm -f "$RUNNER_TEMP/gemini-api-key" "$RUNNER_TEMP/firebase-web-api-key" "$RUNNER_TEMP/cloudinary-url"
