<script>

/* =========================================================
   DONNÉES
========================================================= */

let conversations =
  JSON.parse(
    localStorage.getItem("wiener_conversations") || "[]"
  );

let currentConversation = null;

let selectedFiles = [];

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("message");

const sendButton =
  document.getElementById("sendButton");

const sidebar =
  document.getElementById("sidebar");

const fileInput =
  document.getElementById("fileInput");

const attachments =
  document.getElementById("attachments");


/* =========================================================
   INITIALISATION
========================================================= */

function init(){

  const theme =
    localStorage.getItem("wiener_theme");

  if(theme === "dark"){
    document.body.classList.add("dark");
  }

  renderHistory();

  if(conversations.length > 0){

    currentConversation =
      conversations[0];

    renderConversation();

  }else{

    newChat();

  }

}


/* =========================================================
   NOUVELLE CONVERSATION
========================================================= */

function newChat(){

  currentConversation = {

    id:Date.now(),

    title:"Nouvelle conversation",

    messages:[]

  };

  conversations.unshift(
    currentConversation
  );

  saveConversations();

  renderHistory();

  renderConversation();

  input.focus();

  closeSidebar();

}


/* =========================================================
   HISTORIQUE
========================================================= */

function renderHistory(){

  const list =
    document.getElementById(
      "historyList"
    );

  list.innerHTML = "";

  conversations.forEach(
    conversation => {

      const item =
        document.createElement("div");

      item.className =
        "history-item" +
        (
          currentConversation &&
          currentConversation.id === conversation.id
            ? " active"
            : ""
        );

      item.textContent =
        conversation.title ||
        "Conversation";

      item.onclick = () => {

        currentConversation =
          conversation;

        renderHistory();

        renderConversation();

        closeSidebar();

      };

      list.appendChild(item);

    }
  );

}


/* =========================================================
   AFFICHAGE
========================================================= */

function renderConversation(){

  chat.innerHTML = "";

  if(
    !currentConversation ||
    !currentConversation.messages ||
    currentConversation.messages.length === 0
  ){

    chat.innerHTML = `

      <div class="welcome">

        <div class="welcome-logo">
          🤖
        </div>

        <h1>
          Bonjour 👋
        </h1>

        <p>
          Je suis Wiener IA. Que voulez-vous faire ?
        </p>

        <div class="suggestions">

          <button
            class="suggestion"
            onclick="useSuggestion('Explique-moi ce sujet simplement')">
            📚 Explique-moi un sujet
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Aide-moi à résoudre cet exercice étape par étape')">
            🧮 Résoudre un exercice
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Aide-moi à programmer un projet')">
            💻 M'aider à programmer
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Donne-moi des idées pour mon projet')">
            💡 Trouver des idées
          </button>

        </div>

      </div>

    `;

    return;

  }


  currentConversation.messages.forEach(
    (message,index) => {

      addMessageToScreen(
        message.role,
        message.content,
        index
      );

    }
  );

  scrollBottom();

}


/* =========================================================
   AFFICHER MESSAGE
========================================================= */

function addMessageToScreen(
  role,
  content,
  index
){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;


  const container =
    document.createElement("div");

  container.className =
    "message-content";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    content;


  container.appendChild(
    bubble
  );


  if(role === "assistant"){

    const actions =
      document.createElement("div");

    actions.className =
      "actions";

    actions.innerHTML = `

      <button
        class="action"
        title="Copier"
        onclick="copyText(${index})">
        📋
      </button>

      <button
        class="action"
        title="Lire"
        onclick="speakText(${index})">
        🔊
      </button>

      <button
        class="action"
        title="Régénérer"
        onclick="regenerate(${index})">
        🔄
      </button>

      <button
        class="action"
        title="Bonne réponse"
        onclick="feedback('positive')">
        👍
      </button>

      <button
        class="action"
        title="Mauvaise réponse"
        onclick="feedback('negative')">
        👎
      </button>

    `;

    container.appendChild(
      actions
    );

  }


  wrapper.appendChild(
    container
  );

  chat.appendChild(
    wrapper
  );

}


/* =========================================================
   ENVOI
========================================================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;


  if(!currentConversation){

    newChat();

  }


  if(
    currentConversation.title ===
    "Nouvelle conversation"
  ){

    currentConversation.title =
      text.substring(0,40);

  }


  currentConversation.messages.push({

    role:"user",

    content:text

  });


  input.value = "";

  resizeTextarea(input);

  saveConversations();

  renderConversation();

  showTyping();

  sendButton.disabled = true;


  try{

    /*
      Les fichiers sont conservés côté interface
      pour l'instant.

      Ils seront réellement envoyés au serveur
      à l'étape 2.
    */

    const response =
      await fetch(
        "/api/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            messages:
              currentConversation.messages,

            model:
              document.getElementById(
                "modelSelect"
              ).value

          })

        }
      );


    let data;

    try{

      data =
        await response.json();

    }catch{

      throw new Error(
        "Le serveur a renvoyé une réponse invalide."
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "Erreur du serveur."
      );

    }


    if(!data.answer){

      throw new Error(
        "La réponse de Wiener IA est vide."
      );

    }


    currentConversation.messages.push({

      role:"assistant",

      content:data.answer

    });


    saveConversations();

    hideTyping();

    renderConversation();


    const autoSpeak =
      localStorage.getItem(
        "wiener_auto_speak"
      );

    if(autoSpeak === "yes"){

      speakContent(data.answer);

    }


  }catch(error){

    hideTyping();

    currentConversation.messages.push({

      role:"assistant",

      content:
        "❌ " +
        error.message

    });

    saveConversations();

    renderConversation();

  }finally{

    sendButton.disabled = false;

    input.focus();

  }

}


/* =========================================================
   TYPING
========================================================= */

function showTyping(){

  hideTyping();

  const wrapper =
    document.createElement("div");

  wrapper.id =
    "typing";

  wrapper.className =
    "message assistant";

  wrapper.innerHTML = `

    <div class="typing">

      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>

  `;

  chat.appendChild(
    wrapper
  );

  scrollBottom();

}


function hideTyping(){

  const typing =
    document.getElementById(
      "typing"
    );

  if(typing){
    typing.remove();
  }

}


/* =========================================================
   COPIER
========================================================= */

async function copyText(index){

  const message =
    currentConversation.messages[index];

  if(!message) return;

  try{

    await navigator.clipboard.writeText(
      message.content
    );

  }catch{

    alert(
      "Impossible de copier le texte."
    );

  }

}


/* =========================================================
   VOIX
========================================================= */

function speakText(index){

  const message =
    currentConversation.messages[index];

  if(!message) return;

  speakContent(
    message.content
  );

}


function speakContent(text){

  if(
    !("speechSynthesis" in window)
  ){

    alert(
      "La lecture vocale n'est pas disponible."
    );

    return;

  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  utterance.lang =
    document.getElementById(
      "languageSelect"
    ).value;

  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   DICTÉE
========================================================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "La dictée vocale n'est pas disponible sur ce navigateur."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();

  recognition.lang =
    document.getElementById(
      "languageSelect"
    ).value;

  recognition.interimResults =
    false;

  recognition.continuous =
    false;


  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0]
          .transcript;

      input.value +=
        (
          input.value
            ? " "
            : ""
        ) +
        transcript;

      resizeTextarea(
        input
      );

    };


  recognition.onerror =
    () => {

      console.log(
        "Erreur dictée vocale"
      );

    };


  recognition.start();

}


/* =========================================================
   REGENERER
========================================================= */

async function regenerate(index){

  if(index <= 0)
    return;


  const message =
    currentConversation.messages[index];


  if(
    !message ||
    message.role !== "assistant"
  ){

    return;

  }


  currentConversation.messages =
    currentConversation.messages.slice(
      0,
      index
    );


  saveConversations();

  renderConversation();

  showTyping();

  sendButton.disabled =
    true;


  try{

    const response =
      await fetch(
        "/api/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            messages:
              currentConversation.messages,

            model:
              document.getElementById(
                "modelSelect"
              ).value

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Erreur du serveur."
      );

    }


    if(!data.answer){

      throw new Error(
        "Réponse vide."
      );

    }


    currentConversation.messages.push({

      role:"assistant",

      content:data.answer

    });


    saveConversations();

    hideTyping();

    renderConversation();


  }catch(error){

    hideTyping();

    currentConversation.messages.push({

      role:"assistant",

      content:
        "❌ " +
        error.message

    });

    saveConversations();

    renderConversation();

  }finally{

    sendButton.disabled =
      false;

  }

}

/* =========================================================
   EXPORT
========================================================= */

function exportConversation(){

  if(
    !currentConversation ||
    currentConversation.messages.length === 0
  ){

    alert(
      "Cette conversation est vide."
    );

    return;

  }


  let content =
    "# " +
    currentConversation.title +
    "\n\n";


  currentConversation.messages.forEach(
    message => {

      const name =
        message.role === "user"
          ? "Vous"
          : "Wiener IA";

      content +=
        "## " +
        name +
        "\n\n" +
        message.content +
        "\n\n";

    }
  );


  const blob =
    new Blob(
      [content],
      {
        type:"text/markdown"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    (
      currentConversation.title
        .replace(
          /[^a-z0-9]/gi,
          "_"
        ) ||
      "conversation"
    ) +
    ".md";

  a.click();

  URL.revokeObjectURL(
    url
  );

}

function escapeHTML(text){

  return text
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
