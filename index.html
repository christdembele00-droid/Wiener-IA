<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiener IA</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f5f5f5;
}

header{
  background:#111;
  color:white;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

#chat{
  height:70vh;
  overflow-y:auto;
  padding:20px;
}

.message{
  margin:10px 0;
}

.user{
  text-align:right;
}

.bubble{
  display:inline-block;
  padding:12px;
  border-radius:12px;
  max-width:80%;
}

.user .bubble{
  background:#111;
  color:white;
}

.assistant .bubble{
  background:white;
  border:1px solid #ddd;
}

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  padding:10px;
  background:white;
  border-top:1px solid #ddd;
}

textarea{
  flex:1;
  resize:none;
  padding:10px;
}

button{
  margin-left:10px;
  padding:10px 20px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>Wiener IA</header>

<div id="chat"></div>

<div class="composer">
  <textarea id="message" placeholder="Écrivez un message..."></textarea>
  <button onclick="sendMessage()">Envoyer</button>
</div>

<script>
async function sendMessage() {

  const input = document.getElementById("message");
  const text = input.value.trim();

  if(!text) return;

  const chat = document.getElementById("chat");

  chat.innerHTML += `
    <div class="message user">
      <div class="bubble">${text}</div>
    </div>
  `;

  input.value = "";

  try {

    const response = await fetch("/api/chat", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:text
      })
    });

    const data = await response.json();

    chat.innerHTML += `
      <div class="message assistant">
        <div class="bubble">${data.answer}</div>
      </div>
    `;

    chat.scrollTop = chat.scrollHeight;

  } catch(err) {

    chat.innerHTML += `
      <div class="message assistant">
        <div class="bubble">
          Erreur de connexion au serveur.
        </div>
      </div>
    `;
  }
}
</script>

</body>
</html>
