<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Wiener IA</title><style>
:root{color-scheme:dark;--bg:#171717;--panel:#202020;--line:#343434;--text:#eee;--muted:#999}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,textarea{font:inherit}button{color:inherit;cursor:pointer}#splash{position:fixed;inset:0;z-index:99;background:#171717;display:grid;place-items:center;transition:.45s opacity,.45s visibility}.hide{opacity:0!important;visibility:hidden!important;pointer-events:none}.splash{text-align:center;animation:in .65s ease}.splashLogo,.welcomeLogo{display:grid;place-items:center;background:#fff;color:#111;font-weight:900}.splashLogo{width:92px;height:92px;border-radius:25px;font-size:46px;margin:auto;box-shadow:0 20px 60px #0008}.splashName{font-size:25px;font-weight:750;margin-top:17px}.splashSub{font-size:12px;color:#999;margin-top:4px}@keyframes in{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}.app{height:100%;display:flex}.side{width:270px;background:var(--panel);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:9px 7px 15px}.brandLogo{width:34px;height:34px;border-radius:10px;background:#fff;color:#111;display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{color:#888}.new{width:100%;padding:11px;border:1px solid var(--line);background:transparent;border-radius:10px;text-align:left}.sect{font-size:10px;color:#777;text-transform:uppercase;font-weight:700;letter-spacing:.08em;margin:20px 5px 8px}.history{flex:1;overflow:auto}.hist{width:100%;padding:9px;border:0;background:transparent;border-radius:8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hist:hover,.new:hover{background:#2d2d2d}.bottom{border-top:1px solid var(--line);padding-top:9px}.bottom button{display:block;width:100%;padding:9px;border:0;background:transparent;text-align:left;border-radius:8px;color:#ccc}.bottom button:hover{background:#2d2d2d}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.status{font-size:12px;color:#888}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6ee7b7;margin-right:6px}.menuBtn{display:none;background:transparent;border:0;font-size:20px}.messages{flex:1;overflow:auto;padding:35px 22px 130px}.welcome{max-width:760px;margin:9vh auto;text-align:center}.welcomeLogo{width:54px;height:54px;border-radius:16px;font-size:27px;margin:auto}.welcome h1{font-size:29px;margin:18px 0 7px}.welcome p{color:#999;margin:0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px}.card{padding:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px}.card b{display:block;font-size:13px}.card span{font-size:12px;color:#888}.message{max-width:760px;margin:0 auto 28px;display:flex}.message.user{justify-content:flex-end}.userBubble{max-width:min(70%,620px);background:#303030;border-radius:16px;padding:9px 13px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}.assistantBubble{max-width:760px;font-size:15px;line-height:1.65;overflow-wrap:anywhere}.copy{display:block;margin-top:7px;background:transparent;border:0;color:#777;font-size:11px;padding:4px 0}.copy:hover{color:#ddd}.typing{display:flex;gap:4px;padding:5px 0}.typing i{width:5px;height:5px;border-radius:50%;background:#999;animation:p 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes p{50%{opacity:.2;transform:translateY(-2px)}}pre{background:#101010;border:1px solid #333;padding:12px;border-radius:10px;overflow:auto}code{background:#292929;border-radius:4px;padding:1px 4px}.composerWrap{padding:10px 22px 18px;background:linear-gradient(transparent,#171717 25%)}.composer{max-width:760px;margin:auto;display:flex;align-items:end;gap:7px;background:#292929;border:1px solid #414141;border-radius:16px;padding:7px}.composer textarea{flex:1;min-height:42px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:10px 5px}.tool,.send{width:38px;height:38px;border:0;border-radius:10px;background:transparent}.tool:hover{background:#383838}.send{background:#fff;color:#111;font-weight:800}.send:disabled{opacity:.35}.note{text-align:center;color:#666;font-size:10px;margin-top:7px}.fileName{max-width:760px;margin:5px auto;color:#aaa;font-size:11px}.menu{position:relative}.drop{display:none;position:absolute;bottom:46px;left:0;width:185px;background:#252525;border:1px solid var(--line);border-radius:12px;padding:6px;z-index:10}.drop.open{display:block}.drop button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:8px;font-size:12px}.drop button:hover{background:#343434}.drop span{display:block;color:#888;font-size:10px}@media(max-width:800px){.side{position:fixed;z-index:20;left:-280px;top:0;bottom:0;transition:.2s}.side.open{left:0}.menuBtn{display:block}.top{padding:0 14px}.messages{padding:25px 13px 120px}.cards{grid-template-columns:1fr}.welcome{margin-top:7vh}.composerWrap{padding:8px 10px 14px}.composer{border-radius:14px}.userBubble{max-width:82%}}
</style></head><body><div id="splash"><div class="splash"><div class="splashLogo">W</div><div class="splashName">Wiener IA</div><div class="splashSub">Créée par Dembele Christ</div></div></div><div class="app"><aside class="side" id="side"><div class="brand"><div class="brandLogo">W</div><div><b>Wiener IA</b><small>Créée par Dembele Christ</small></div></div><button class="new" id="new">＋ Nouvelle conversation</button><div class="sect">Conversations</div><div class="history" id="history"></div><div class="bottom"><button id="clear">Effacer l’historique</button><button id="settings">Paramètres</button></div></aside><main class="main"><header class="top"><button class="menuBtn" id="menu">☰</button><b>Wiener IA</b><span class="status"><i></i>Prêt</span></header><section class="messages" id="messages"><div class="welcome" id="welcome"><div class="welcomeLogo">W</div><h1>Comment puis-je vous aider ?</h1><p>Posez une question, envoyez un exercice ou utilisez un outil.</p><div class="cards"><button class="card" data-p="Explique-moi simplement un concept difficile."><b>Comprendre</b><span>Une explication claire et progressive</span></button><button class="card" data-mode="search" data-p="Recherche les informations les plus récentes sur ce sujet."><b>Rechercher</b><span>Informations actuelles et vérifiables</span></button><button class="card" data-mode="exercise" data-p="Aide-moi à résoudre cet exercice étape par étape."><b>Résoudre</b><span>Maths, sciences et autres exercices</span></button><button class="card" data-mode="image" data-p="Crée une image correspondant à ma description."><b>Créer</b><span>Génération d’image</span></button></div></div></section><div class="composerWrap"><div class="composer"><div class="menu"><button class="tool" id="mode">＋</button><div class="drop" id="drop"><button data-m="chat"><b>Chat</b><span>Conversation générale</span></button><button data-m="search"><b>Recherche Web</b><span>Recherche avec Google</span></button><button data-m="exercise"><b>Exercice</b><span>Résolution structurée</span></button><button data-m="image"><b>Image</b><span>Générer une image</span></button></div></div><button class="tool" id="attach">⌕</button><input id="file" type="file" hidden accept="application/pdf,image/png,image/jpeg,image/webp"><textarea id="input" rows="1" placeholder="Écrivez un message…"></textarea><button class="tool" id="mic">◉</button><button class="send" id="send">↑</button></div><div class="fileName" id="fileName"></div><div class="note">Wiener IA peut faire des erreurs. Vérifiez les informations importantes.</div></div></main></div><script>
const API='https://wiener-ia.onrender.com',KEY='wiener_ia_history_v5',$=x=>document.getElementById(x);let history=[],mode='chat',busy=false,file=null,id=Date.now();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const md=s=>esc(s).replace(/```[\w+-]*\n?([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');function add(text,who,typing=false){$('welcome')?.remove();let d=document.createElement('div');d.className='message '+who;let b=document.createElement('div');b.className=who==='user'?'userBubble':'assistantBubble';b.innerHTML=typing?'<div class="typing"><i></i><i></i><i></i></div>':who==='user'?esc(text):md(text);if(who==='assistant'&&!typing){let c=document.createElement('button');c.className='copy';c.textContent='Copier';c.onclick=()=>navigator.clipboard?.writeText(text);b.append(c)}d.append(b);$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight;return d}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(){let a=load().filter(x=>x.id!==id);if(history.length)a.push({id,title:history.find(x=>x.role==='user')?.content?.slice(0,50)||'Conversation',history});localStorage.setItem(KEY,JSON.stringify(a.slice(-50)))}function renderHistory(){let a=load().reverse();$('history').innerHTML='';if(!a.length){$('history').innerHTML='<div style="color:#707070;font-size:12px;padding:8px">Aucune conversation enregistrée.</div>';return}a.forEach(x=>{let b=document.createElement('button');b.className='hist';b.textContent=x.title||'Conversation';b.onclick=()=>{history=x.history||[];id=x.id||Date.now();$('messages').innerHTML='';history.forEach(m=>add(m.content,m.role));mode='chat';$('side').classList.remove('open')};$('history').append(b)})}function fresh(){history=[];id=Date.now();mode='chat';$('messages').innerHTML='<div class="welcome" id="welcome"><div class="welcomeLogo">W</div><h1>Comment puis-je vous aider ?</h1><p>Posez une question, envoyez un exercice ou utilisez un outil.</p></div>';renderHistory();document.querySelectorAll('.card').forEach(bind)}async function req(path,opt){let r=await fetch(API+path,opt),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Le serveur ne répond pas.');return d}async function send(){if(busy)return;let text=$('input').value.trim();if(!text&&!file)return;busy=true;$('send').disabled=true;const taskMode=mode;mode='chat';let shown=text||'Analyse le fichier joint.';add(shown,'user');history.push({role:'user',content:shown});$('input').value='';let typing=add('','assistant',true);try{let d;if(file){let f=new FormData;f.append('file',file);f.append('prompt',text||'Analyse ce fichier clairement.');d=await req('/api/analyze-file',{method:'POST',body:f});file=null;$('file').value='';$('fileName').textContent=''}else if(taskMode==='search')d=await req('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:text})});else if(taskMode==='exercise')d=await req('/api/exercises',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});else if(taskMode==='image')d=await req('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text})});else d=await req('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-12)})});typing.remove();let answer=d.answer||d.response||d.analysis||'';if(d.image){let m=add('','assistant');m.querySelector('.assistantBubble').innerHTML='<img src="'+d.image+'" style="max-width:100%;border-radius:14px;display:block">'}else{add(answer,'assistant');history.push({role:'assistant',content:answer})}save();renderHistory()}catch(e){typing.remove();add(e.message,'assistant')}finally{mode='chat';busy=false;$('send').disabled=false;$('input').focus()}}function bind(b){b.onclick=()=>{$('input').value=b.dataset.p||'';mode=b.dataset.mode||'chat';send()}}document.querySelectorAll('.card').forEach(bind);$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('input').addEventListener('input',()=>{$('input').style.height='auto';$('input').style.height=Math.min($('input').scrollHeight,180)+'px'});$('new').onclick=fresh;$('clear').onclick=()=>{localStorage.removeItem(KEY);fresh()};$('menu').onclick=()=>$('side').classList.toggle('open');$('mode').onclick=()=>$('drop').classList.toggle('open');$('drop').onclick=e=>{let b=e.target.closest('[data-m]');if(b){mode=b.dataset.m;$('drop').classList.remove('open')}};$('attach').onclick=()=>$('file').click();$('file').onchange=()=>{file=$('file').files[0]||null;$('fileName').textContent=file?'Fichier : '+file.name:''};$('settings').onclick=()=>alert('Les conversations sont conservées localement dans ce navigateur.');$('mic').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Dictée vocale non disponible sur ce navigateur.');let r=new R;r.lang='fr-FR';r.onresult=e=>{$('input').value=e.results[0][0].transcript};r.start()};renderHistory();$('input').focus();fetch(API+'/api/health',{cache:'no-store'}).catch(()=>{});setTimeout(()=>$('splash').classList.add('hide'),3000);
</script></body></html>
