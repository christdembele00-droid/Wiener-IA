<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wiener IA</title>

<style>
:root{
  --bg:#ffffff;
  --panel:#f8f9fb;
  --surface:#ffffff;
  --surface-hover:#f1f3f5;
  --text:#17181a;
  --muted:#6b7078;
  --border:#e4e6e9;
  --accent:#111214;
  --accent-text:#ffffff;
  --user:#f0f1f3;
  --danger:#d93025;
  --shadow:0 8px 30px rgba(0,0,0,.06);
}

body.dark{
  --bg:#18191b;
  --panel:#202123;
  --surface:#18191b;
  --surface-hover:#292b2e;
  --text:#f5f5f5;
  --muted:#a5a8ad;
  --border:#34363a;
  --accent:#f4f4f5;
  --accent-text:#17181a;
  --user:#2b2d30;
  --shadow:0 8px 30px rgba(0,0,0,.25);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================
   APP
========================= */

.app{
  display:flex;
  width:100%;
  height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:270px;
  height:100%;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:12px;
  flex-shrink:0;
  transition:transform .25s ease;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 10px 18px;
}

.brand-symbol{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--accent);
  color:var(--accent-text);
  font-size:18px;
  font-weight:800;
}

.brand-name{
  font-size:18px;
  font-weight:700;
  letter-spacing:-.3px;
}

.new-chat{
  width:100%;
  height:44px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  text-align:left;
  padding:0 14px;
  transition:.18s;
}

.new-chat:hover{
  background:var(--surface-hover);
  transform:translateY(-1px);
}

.history{
  flex:1;
  min-height:0;
  overflow-y:auto;
  margin-top:18px;
}

.history-label{
  padding:8px 10px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.history-item{
  padding:10px 11px;
  margin:2px 0;
  border-radius:9px;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:.15s;
}

.history-item:hover,
.history-item.active{
  background:var(--surface-hover);
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:10px;
}

.side-button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  height:40px;
  border-radius:9px;
  text-align:left;
  padding:0 10px;
  cursor:pointer;
  font-size:13px;
}

.side-button:hover{
  background:var(--surface-hover);
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  height:60px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  gap:12px;
}

.menu{
  display:none;
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:var(--text);
  font-size:22px;
  cursor:pointer;
  border-radius:9px;
}

.menu:hover{
  background:var(--surface-hover);
}

.top-title{
  font-size:16px;
  font-weight:700;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#38a169;
}

.top-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:6px;
}

.top-button{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:9px;
  height:34px;
  padding:0 10px;
  cursor:pointer;
  font-size:12px;
}

.top-button:hover{
  background:var(--surface-hover);
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  overflow-y:auto;
  padding:35px 20px 20px;
  scroll-behavior:smooth;
}

.chat-inner{
  width:min(850px,100%);
  margin:auto;
}

.message{
  display:flex;
  margin-bottom:28px;
  animation:messageIn .18s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.message-content{
  max-width:820px;
  min-width:0;
}

.user .message-content{
  max-width:min(720px,85%);
}

.bubble{
  line-height:1.65;
  font-size:15px;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:var(--user);
  border-radius:18px;
  padding:11px 15px;
  white-space:pre-wrap;
}

.assistant .bubble{
  padding:2px 0;
}

/* =========================
   MARKDOWN
========================= */

.assistant .bubble h1,
.assistant .bubble h2,
.assistant .bubble h3{
  margin:18px 0 8px;
  line-height:1.25;
}

.assistant .bubble h1{
  font-size:25px;
}

.assistant .bubble h2{
  font-size:20px;
}

.assistant .bubble h3{
  font-size:17px;
}

.assistant .bubble p{
  margin:8px 0;
}

.assistant .bubble ul,
.assistant .bubble ol{
  padding-left:25px;
}

.assistant .bubble li{
  margin:5px 0;
}

.assistant .bubble code{
  background:var(--surface-hover);
  border:1px solid var(--border);
  border-radius:5px;
  padding:2px 5px;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;
  font-size:13px;
}

.code-block{
  position:relative;
  margin:12px 0;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:12px;
  overflow:auto;
}

.code-block pre{
  margin:0;
  padding:15px;
  padding-top:42px;
  overflow:auto;
}

.code-block code{
  border:0 !important;
  background:transparent !important;
  padding:0 !important;
  white-space:pre;
}

.copy-code{
  position:absolute;
  right:8px;
  top:8px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:7px;
  padding:5px 8px;
  cursor:pointer;
  font-size:11px;
}

/* =========================
   ACTIONS
========================= */

.actions{
  display:flex;
  gap:3px;
  margin-top:7px;
}

.action{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  width:32px;
  height:30px;
  border-radius:7px;
}

.action:hover{
  background:var(--surface-hover);
  color:var(--text);
}

/* =========================
   TYPING
========================= */

.typing{
  display:flex;
  gap:5px;
  padding:8px 0;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--muted);
  animation:pulse 1.2s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes pulse{
  0%,80%,100%{
    opacity:.25;
  }
  40%{
    opacity:1;
  }
}

/* =========================
   WELCOME
========================= */

.welcome{
  max-width:850px;
  margin:13vh auto 0;
  text-align:center;
  padding:0 10px;
}

.welcome-symbol{
  width:58px;
  height:58px;
  border-radius:17px;
  background:var(--accent);
  color:var(--accent-text);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:26px;
  font-weight:800;
}

.welcome h1{
  margin:18px 0 7px;
  font-size:32px;
  letter-spacing:-1px;
}

.welcome p{
  color:var(--muted);
  margin:0;
  font-size:14px;
}

.suggestions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:28px;
}

.suggestion{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:12px;
  padding:15px;
  text-align:left;
  cursor:pointer;
  transition:.15s;
  font-size:13px;
}

.suggestion:hover{
  background:var(--surface-hover);
  transform:translateY(-1px);
}

/* =========================
   COMPOSER
========================= */

.composer-area{
  flex-shrink:0;
  padding:8px 20px 15px;
  background:var(--bg);
}

.composer{
  width:min(900px,100%);
  margin:auto;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:17px;
  box-shadow:var(--shadow);
  padding:7px;
}

.attachments{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:3px;
}

.attachment{
  display:flex;
  align-items:center;
  gap:7px;
  background:var(--surface-hover);
  border:1px solid var(--border);
  border-radius:8px;
  padding:6px 8px;
  font-size:11px;
}

.remove-file{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}

.composer-row{
  display:flex;
  align-items:flex-end;
  gap:3px;
}

.tool{
  flex-shrink:0;
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:9px;
  cursor:pointer;
  font-size:17px;
}

.tool:hover{
  background:var(--surface-hover);
  color:var(--text);
}

.textarea{
  flex:1;
  min-width:0;
  max-height:180px;
  min-height:42px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
  line-height:1.5;
  padding:10px 8px;
}

.send{
  width:40px;
  height:40px;
  flex-shrink:0;
  border:0;
  border-radius:10px;
  background:var(--accent);
  color:var(--accent-text);
  cursor:pointer;
  font-size:18px;
  transition:.15s;
}

.send:hover{
  transform:scale(1.03);
}

.send:disabled{
  opacity:.35;
  cursor:not-allowed;
  transform:none;
}

.file-info{
  color:var(--muted);
  font-size:11px;
  padding:3px 7px;
}

.disclaimer{
  width:min(900px,100%);
  margin:6px auto 0;
  text-align:center;
  color:var(--muted);
  font-size:10px;
}

/* =========================
   OVERLAY
========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:90;
}

.overlay.show{
  display:block;
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:300;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(480px,100%);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  box-shadow:var(--shadow);
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-header h2{
  margin:0;
  font-size:18px;
}

.close{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:22px;
  cursor:pointer;
}

.setting{
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.setting:last-child{
  border-bottom:0;
}

.setting label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:8px;
}

.setting select{
  width:100%;
  padding:9px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  color:var(--text);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .menu{
    display:block;
  }

  .topbar{
    padding:0 10px;
  }

  .status{
    display:none;
  }

  .top-actions{
    display:none;
  }

  .chat{
    padding:22px 12px 12px;
  }

  .composer-area{
    padding:6px 8px 10px;
  }

  .welcome{
    margin-top:12vh;
  }

  .welcome h1{
    font-size:25px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .user .message-content{
    max-width:90%;
  }

  .bubble{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <div class="brand-symbol">W</div>

      <div class="brand-name">
        Wiener IA
      </div>

    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ Nouvelle conversation
    </button>

    <div class="history">

      <div class="history-label">
        Conversations
      </div>

      <div id="historyList"></div>

    </div>

    <div class="sidebar-bottom">

      <button class="side-button" onclick="openSettings()">
        ⚙ Paramètres
      </button>

      <button class="side-button" onclick="toggleTheme()">
        ◐ Apparence
      </button>

      <button class="side-button" onclick="exportConversation()">
        ⇩ Exporter
      </button>

      <button class="side-button" onclick="clearAllHistory()">
        Effacer l'historique
      </button>

    </div>

  </aside>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button class="menu" onclick="toggleSidebar()">
        ☰
      </button>

      <div class="top-title">
        Wiener IA
      </div>

      <div class="status">
        <span class="status-dot"></span>
        En ligne
      </div>

      <div class="top-actions">

        <button class="top-button" onclick="newChat()">
          Nouvelle discussion
        </button>

      </div>

    </header>

    <section class="chat" id="chat">

      <div class="chat-inner" id="chatInner"></div>

    </section>

    <!-- COMPOSER -->

    <div class="composer-area">

      <div class="composer">

        <div
          class="attachments"
          id="attachments">
        </div>

        <div class="composer-row">

          <button
            class="tool"
            title="Joindre un fichier"
            onclick="chooseFile()">
            ＋
          </button>

          <input
            id="fileInput"
            type="file"
            hidden
            multiple
            accept=".txt,.pdf,.doc,.docx,.csv,.json,.jpg,.jpeg,.png,.webp"
            onchange="handleFiles(event)"
          >

          <button
            class="tool"
            title="Dictée vocale"
            onclick="startVoice()">
            ◉
          </button>

          <textarea
            id="message"
            class="textarea"
            rows="1"
            placeholder="Demandez quelque chose à Wiener IA..."
            onkeydown="handleKey(event)"
            oninput="resizeTextarea(this)"
          ></textarea>

          <button
            class="send"
            id="sendButton"
            onclick="sendMessage()">
            ↑
          </button>

        </div>

        <div
          id="fileInfo"
          class="file-info">
        </div>

      </div>

      <div class="disclaimer">
        Wiener IA peut faire des erreurs. Vérifiez les informations importantes.
      </div>

    </div>

  </main>

</div>


<!-- SETTINGS -->

<div class="modal" id="settingsModal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>Paramètres</h2>

      <button
        class="close"
        onclick="closeSettings()">
        ×
      </button>

    </div>

    <div class="setting">

      <label>
        Langue
      </label>

      <select id="languageSelect">
        <option value="fr-FR">Français</option>
        <option value="en-US">English</option>
        <option value="es-ES">Español</option>
      </select>

    </div>

    <div class="setting">

      <label>
        Lecture automatique
      </label>

      <select id="autoSpeak">
        <option value="no">Désactivée</option>
        <option value="yes">Activée</option>
      </select>

    </div>

  </div>

</div>


<script>

/* =========================================================
   DONNÉES
========================================================= */

let conversations =
  JSON.parse(
    localStorage.getItem("wiener_conversations") || "[]"
  );

let currentConversation = null;

let selectedFiles = [];

const chat =
  document.getElementById("chat");

const chatInner =
  document.getElementById("chatInner");

const input =
  document.getElementById("message");

const sendButton =
  document.getElementById("sendButton");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const fileInput =
  document.getElementById("fileInput");

const attachments =
  document.getElementById("attachments");


/* =========================================================
   INITIALISATION
========================================================= */

function init(){

  const theme =
    localStorage.getItem("wiener_theme");

  if(theme === "dark"){
    document.body.classList.add("dark");
  }

  document.getElementById("languageSelect").value =
    localStorage.getItem("wiener_language") ||
    "fr-FR";

  document.getElementById("autoSpeak").value =
    localStorage.getItem("wiener_auto_speak") ||
    "no";

  renderHistory();

  if(conversations.length){

    currentConversation =
      conversations[0];

    renderConversation();

  }else{

    createFreshConversation(false);

  }

  input.focus();

}


/* =========================================================
   NOUVELLE CONVERSATION
========================================================= */

function createFreshConversation(save = true){

  currentConversation = {

    id:Date.now(),

    title:"Nouvelle conversation",

    messages:[]

  };

  if(save){

    conversations.unshift(
      currentConversation
    );

    saveConversations();

  }

  renderHistory();

  renderConversation();

  selectedFiles = [];

  renderAttachments();

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat(){

  createFreshConversation(true);

  input.focus();

  closeSidebar();

}


/* =========================================================
   HISTORIQUE
========================================================= */

function renderHistory(){

  const list =
    document.getElementById("historyList");

  list.innerHTML = "";

  conversations.forEach(
    conversation => {

      const item =
        document.createElement("div");

      item.className =
        "history-item" +
        (
          currentConversation &&
          currentConversation.id === conversation.id
            ? " active"
            : ""
        );

      item.textContent =
        conversation.title ||
        "Conversation";

      item.onclick = () => {

        currentConversation =
          conversation;

        renderHistory();

        renderConversation();

        closeSidebar();

      };

      list.appendChild(item);

    }
  );

}


/* =========================================================
   AFFICHAGE CONVERSATION
========================================================= */

function renderConversation(){

  chatInner.innerHTML = "";

  if(
    !currentConversation ||
    !currentConversation.messages ||
    currentConversation.messages.length === 0
  ){

    renderWelcome();

    return;

  }

  currentConversation.messages.forEach(
    (message,index) => {

      addMessageToScreen(
        message.role,
        message.content,
        index
      );

    }
  );

  scrollBottom();

}


/* =========================================================
   WELCOME
========================================================= */

function renderWelcome(){

  chatInner.innerHTML = `

    <div class="welcome">

      <div class="welcome-symbol">
        W
      </div>

      <h1>
        Bonjour 👋
      </h1>

      <p>
        Que souhaitez-vous faire aujourd'hui ?
      </p>

      <div class="suggestions">

        <button
          class="suggestion"
          onclick="useSuggestion('Explique-moi ce sujet simplement, avec des exemples')">
          📚 Explique-moi un sujet
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Résous cet exercice étape par étape et explique chaque calcul')">
          🧮 Résoudre un exercice
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Aide-moi à programmer mon projet étape par étape')">
          💻 Programmer
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Donne-moi des idées originales pour mon projet')">
          💡 Trouver des idées
        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   MESSAGE
========================================================= */

function addMessageToScreen(
  role,
  content,
  index
){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;

  const container =
    document.createElement("div");

  container.className =
    "message-content";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  if(role === "assistant"){

    bubble.innerHTML =
      renderMarkdown(content);

  }else{

    bubble.textContent =
      content;

  }

  container.appendChild(bubble);

  if(role === "assistant"){

    const actions =
      document.createElement("div");

    actions.className =
      "actions";

    actions.innerHTML = `

      <button
        class="action"
        title="Copier"
        onclick="copyText(${index})">
        ⧉
      </button>

      <button
        class="action"
        title="Lire"
        onclick="speakText(${index})">
        🔊
      </button>

      <button
        class="action"
        title="Régénérer"
        onclick="regenerate(${index})">
        ↻
      </button>

      <button
        class="action"
        title="Bonne réponse"
        onclick="feedback('positive')">
        👍
      </button>

      <button
        class="action"
        title="Mauvaise réponse"
        onclick="feedback('negative')">
        👎
      </button>

    `;

    container.appendChild(actions);

  }

  wrapper.appendChild(container);

  chatInner.appendChild(wrapper);

}


/* =========================================================
   MARKDOWN SIMPLE
========================================================= */

function renderMarkdown(text){

  if(!text) return "";

  let safe =
    escapeHTML(text);

  const blocks = [];

  safe =
    safe.replace(
      /```([\s\S]*?)```/g,
      (_,code) => {

        const id =
          "code_" +
          Math.random()
            .toString(36)
            .slice(2);

        blocks.push({
          id,
          code
        });

        return `@@${id}@@`;

      }
    );

  safe =
    safe.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );

  safe =
    safe.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );

  safe =
    safe.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );

  safe =
    safe.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  safe =
    safe.replace(
      /\*(.*?)\*/g,
      "<em>$1</em>"
    );

  safe =
    safe.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );

  safe =
    safe.replace(
      /^\- (.*)$/gm,
      "<li>$1</li>"
    );

  safe =
    safe.replace(
      /(<li>.*<\/li>)/gs,
      "<ul>$1</ul>"
    );

  safe =
    safe.replace(
      /\n\n/g,
      "</p><p>"
    );

  safe =
    "<p>" +
    safe +
    "</p>";

  blocks.forEach(
    block => {

      const html = `

        <div class="code-block">

          <button
            class="copy-code"
            onclick="copyCode('${block.id}')">
            Copier
          </button>

          <pre>
            <code id="${block.id}">${block.code}</code>
          </pre>

        </div>

      `;

      safe =
        safe.replace(
          `@@${block.id}@@`,
          html
        );

    }
  );

  return safe;

}


function copyCode(id){

  const element =
    document.getElementById(id);

  if(!element) return;

  navigator.clipboard.writeText(
    element.textContent
  );

}


/* =========================================================
   ENVOI
========================================================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text || sendButton.disabled)
    return;

  if(!currentConversation){

    createFreshConversation(true);

  }

  if(
    currentConversation.title ===
    "Nouvelle conversation"
  ){

    currentConversation.title =
      text.substring(0,50);

  }

  currentConversation.messages.push({

    role:"user",

    content:text

  });

  input.value = "";

  resizeTextarea(input);

  saveConversations();

  renderConversation();

  showTyping();

  sendButton.disabled = true;

  try{

    const response =
      await fetch(
        "/api/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            messages:
              currentConversation.messages

          })

        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Erreur du serveur."
      );

    }

    if(!data.answer){

      throw new Error(
        "Wiener IA n'a retourné aucune réponse."
      );

    }

    hideTyping();

    currentConversation.messages.push({

      role:"assistant",

      content:data.answer

    });

    saveConversations();

    renderConversation();

    if(
      localStorage.getItem(
        "wiener_auto_speak"
      ) === "yes"
    ){

      speakContent(
        data.answer
      );

    }

  }catch(error){

    hideTyping();

    currentConversation.messages.push({

      role:"assistant",

      content:
        "❌ " +
        error.message

    });

    saveConversations();

    renderConversation();

  }finally{

    sendButton.disabled = false;

    input.focus();

  }

}


/* =========================================================
   TYPING
========================================================= */

function showTyping(){

  hideTyping();

  const wrapper =
    document.createElement("div");

  wrapper.id =
    "typing";

  wrapper.className =
    "message assistant";

  wrapper.innerHTML = `

    <div class="typing">

      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>

  `;

  chatInner.appendChild(wrapper);

  scrollBottom();

}


function hideTyping(){

  const typing =
    document.getElementById("typing");

  if(typing)
    typing.remove();

}


/* =========================================================
   COPIER
========================================================= */

async function copyText(index){

  const message =
    currentConversation.messages[index];

  if(!message)
    return;

  try{

    await navigator.clipboard.writeText(
      message.content
    );

  }catch{

    alert(
      "Impossible de copier le texte."
    );

  }

}


/* =========================================================
   REGENERER
========================================================= */

async function regenerate(index){

  if(index <= 0)
    return;

  const message =
    currentConversation.messages[index];

  if(
    !message ||
    message.role !== "assistant"
  )
    return;

  currentConversation.messages =
    currentConversation.messages.slice(
      0,
      index
    );

  saveConversations();

  renderConversation();

  showTyping();

  sendButton.disabled = true;

  try{

    const response =
      await fetch(
        "/api/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            messages:
              currentConversation.messages

          })

        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Erreur du serveur."
      );

    }

    currentConversation.messages.push({

      role:"assistant",

      content:data.answer

    });

    saveConversations();

    hideTyping();

    renderConversation();

  }catch(error){

    hideTyping();

    currentConversation.messages.push({

      role:"assistant",

      content:
        "❌ " +
        error.message

    });

    saveConversations();

    renderConversation();

  }finally{

    sendButton.disabled = false;

  }

}

/* =========================================================
   VOIX
========================================================= */

function speakText(index){

  const message =
    currentConversation.messages[index];

  if(message)
    speakContent(message.content);

}


function speakContent(text){

  if(
    !("speechSynthesis" in window)
  ){

    alert(
      "La lecture vocale n'est pas disponible."
    );

    return;

  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  utterance.lang =
    document.getElementById(
      "languageSelect"
    ).value;

  speechSynthesis.speak(
    utterance
  );

}


function startVoice(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!Recognition){

    alert(
      "La dictée vocale n'est pas disponible sur ce navigateur."
    );

    return;

  }

  const recognition =
    new Recognition();

  recognition.lang =
    document.getElementById(
      "languageSelect"
    ).value;

  recognition.interimResults =
    false;

  recognition.continuous =
    false;

  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0]
          .transcript;

      input.value +=
        (
          input.value
            ? " "
            : ""
        ) +
        transcript;

      resizeTextarea(input);

    };

  recognition.start();

}

/* =========================================================
   EXPORT
========================================================= */

function exportConversation(){

  if(
    !currentConversation ||
    !currentConversation.messages.length
  ){

    alert(
      "Cette conversation est vide."
    );

    return;

  }

  let content =
    "# " +
    currentConversation.title +
    "\n\n";

  currentConversation.messages.forEach(
    message => {

      content +=
        "## " +
        (
          message.role === "user"
            ? "Vous"
            : "Wiener IA"
        ) +
        "\n\n" +
        message.content +
        "\n\n";

    }
  );

  const blob =
    new Blob(
      [content],
      {
        type:"text/markdown"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    (
      currentConversation.title
        .replace(
          /[^a-z0-9]/gi,
          "_"
        ) ||
      "conversation"
    ) +
    ".md";

  a.click();

  URL.revokeObjectURL(url);

}


/* =========================================================
   SUPPRESSION HISTORIQUE
========================================================= */

function clearAllHistory(){

  if(
    !confirm(
      "Supprimer toutes les conversations ?"
    )
  )
    return;

  conversations = [];

  localStorage.removeItem(
    "wiener_conversations"
  );

  createFreshConversation(false);

  renderHistory();

}


/* =========================================================
   SAUVEGARDE
========================================================= */

function saveConversations(){

  localStorage.setItem(
    "wiener_conversations",
    JSON.stringify(conversations)
  );

  renderHistory();

}


/* =========================================================
   CLAVIER
========================================================= */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* =========================================================
   TEXTAREA
========================================================= */

function resizeTextarea(element){

  element.style.height =
    "auto";

  element.style.height =
    Math.min(
      element.scrollHeight,
      180
    ) +
    "px";

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}

   SIDEBAR
========================================================= */

function toggleSidebar(){

  sidebar.classList.toggle("open");

  overlay.classList.toggle(
    "show"
  );

}


function closeSidebar(){

  sidebar.classList.remove("open");

  overlay.classList.remove(
    "show"
  );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
