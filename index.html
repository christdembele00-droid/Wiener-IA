```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiener IA</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#ffffff;
  --sidebar:#f7f7f8;
  --text:#171717;
  --muted:#6b7280;
  --border:#e5e7eb;
  --hover:#ececec;
  --assistant:#ffffff;
  --user:#f3f4f6;
  --accent:#111111;
}

body.dark{
  --bg:#212121;
  --sidebar:#171717;
  --text:#f5f5f5;
  --muted:#a1a1aa;
  --border:#333333;
  --hover:#2d2d2d;
  --assistant:#212121;
  --user:#303030;
  --accent:#ffffff;
}

html,body{
  margin:0;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:12px;
  transition:.25s;
}

.logo{
  font-size:20px;
  font-weight:bold;
  padding:12px;
}

.new-chat{
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:8px;
  padding:11px;
  cursor:pointer;
  font-size:14px;
  margin-bottom:12px;
}

.new-chat:hover{
  background:var(--hover);
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-title{
  color:var(--muted);
  font-size:12px;
  padding:10px;
}

.history-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:14px;
}

.history-item:hover{
  background:var(--hover);
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:10px;
}

.sidebar-button{
  width:100%;
  padding:10px;
  background:transparent;
  color:var(--text);
  border:0;
  text-align:left;
  border-radius:8px;
  cursor:pointer;
}

.sidebar-button:hover{
  background:var(--hover);
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:60px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:12px;
}

.menu{
  display:none;
  border:0;
  background:transparent;
  color:var(--text);
  font-size:24px;
  cursor:pointer;
}

.title{
  font-weight:bold;
  font-size:17px;
}

/* CHAT */

#chat{
  flex:1;
  overflow-y:auto;
  padding:25px 15%;
}

.message{
  display:flex;
  margin-bottom:25px;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:800px;
  padding:13px 16px;
  border-radius:14px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:var(--user);
}

.assistant .bubble{
  background:var(--assistant);
}

.actions{
  display:flex;
  gap:5px;
  margin-top:7px;
}

.action{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  padding:5px 7px;
  border-radius:6px;
}

.action:hover{
  background:var(--hover);
}

/* WELCOME */

.welcome{
  text-align:center;
  margin-top:15vh;
}

.welcome h1{
  font-size:32px;
  margin-bottom:10px;
}

.welcome p{
  color:var(--muted);
}

/* TYPING */

.typing{
  display:flex;
  gap:5px;
  padding:8px 2px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--muted);
  animation:blink 1.2s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,80%,100%{opacity:.3}
  40%{opacity:1}
}

/* COMPOSER */

.composer-area{
  padding:10px 15% 18px;
}

.composer{
  max-width:900px;
  margin:auto;
  border:1px solid var(--border);
  background:var(--bg);
  border-radius:15px;
  display:flex;
  align-items:flex-end;
  padding:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:var(--text);
  padding:10px;
  min-height:44px;
  max-height:180px;
  font-size:15px;
  font-family:inherit;
}

.send{
  border:0;
  border-radius:9px;
  background:var(--accent);
  color:var(--bg);
  width:42px;
  height:42px;
  cursor:pointer;
  font-size:18px;
}

.send:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.tools{
  display:flex;
  align-items:center;
  gap:5px;
}

.tool{
  border:0;
  background:transparent;
  color:var(--muted);
  width:38px;
  height:38px;
  border-radius:8px;
  cursor:pointer;
  font-size:18px;
}

.tool:hover{
  background:var(--hover);
}

.disclaimer{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  margin-top:7px;
}

/* MOBILE */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    z-index:20;
    left:-280px;
    top:0;
    bottom:0;
  }

  .sidebar.open{
    left:0;
  }

  .menu{
    display:block;
  }

  #chat{
    padding:20px 12px;
  }

  .composer-area{
    padding:8px 8px 12px;
  }

  .welcome{
    margin-top:20vh;
  }

  .welcome h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

  <div class="logo">🤖 Wiener IA</div>

  <button class="new-chat" onclick="newChat()">
    ＋ Nouvelle conversation
  </button>

  <div class="history">
    <div class="history-title">Historique</div>
    <div id="historyList"></div>
  </div>

  <div class="sidebar-bottom">

    <button class="sidebar-button" onclick="toggleTheme()">
      🌙 Changer de thème
    </button>

    <button class="sidebar-button" onclick="clearAllHistory()">
      🗑️ Effacer l'historique
    </button>

  </div>

</aside>

<main class="main">

  <header class="topbar">
    <button class="menu" onclick="toggleSidebar()">☰</button>
    <div class="title">Wiener IA</div>
  </header>

  <div id="chat"></div>

  <div class="composer-area">

    <div class="composer">

      <div class="tools">
        <button class="tool" title="Dictée vocale" onclick="startVoice()">🎤</button>
      </div>

      <textarea
        id="message"
        rows="1"
        placeholder="Écrivez un message..."
        onkeydown="handleKey(event)"
        oninput="resizeTextarea(this)"
      ></textarea>

      <button class="send" id="sendButton" onclick="sendMessage()">
        ↑
      </button>

    </div>

    <div class="disclaimer">
      Wiener IA peut faire des erreurs. Vérifiez les informations importantes.
    </div>

  </div>

</main>

<script>

/* =========================
   VARIABLES
========================= */

let conversations =
  JSON.parse(localStorage.getItem("wiener_conversations") || "[]");

let currentConversation = null;

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("sendButton");
const sidebar = document.getElementById("sidebar");


/* =========================
   INITIALISATION
========================= */

function init(){

  const theme =
    localStorage.getItem("wiener_theme");

  if(theme === "dark"){
    document.body.classList.add("dark");
  }

  renderHistory();

  if(conversations.length > 0){

    currentConversation =
      conversations[0];

    renderConversation();

  }else{

    newChat();

  }
}


/* =========================
   NOUVELLE CONVERSATION
========================= */

function newChat(){

  currentConversation = {
    id:Date.now(),
    title:"Nouvelle conversation",
    messages:[]
  };

  conversations.unshift(currentConversation);

  saveConversations();

  renderHistory();

  renderConversation();

  input.focus();

  closeSidebar();
}


/* =========================
   HISTORIQUE
========================= */

function renderHistory(){

  const list =
    document.getElementById("historyList");

  list.innerHTML = "";

  conversations.forEach(conversation => {

    const item =
      document.createElement("div");

    item.className = "history-item";

    item.textContent =
      conversation.title || "Conversation";

    item.onclick = () => {

      currentConversation =
        conversation;

      renderConversation();

      closeSidebar();
    };

    list.appendChild(item);

  });
}


/* =========================
   AFFICHAGE CONVERSATION
========================= */

function renderConversation(){

  chat.innerHTML = "";

  if(!currentConversation ||
     currentConversation.messages.length === 0){

    chat.innerHTML = `
      <div class="welcome">
        <h1>Bonjour 👋</h1>
        <p>Je suis Wiener IA. Comment puis-je vous aider ?</p>
      </div>
    `;

    return;
  }

  currentConversation.messages
    .forEach((message,index) => {

      addMessageToScreen(
        message.role,
        message.content,
        index
      );

    });

  scrollBottom();
}


/* =========================
   AFFICHER MESSAGE
========================= */

function addMessageToScreen(
  role,
  content,
  index
){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;

  const container =
    document.createElement("div");

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = content;

  container.appendChild(bubble);

  if(role === "assistant"){

    const actions =
      document.createElement("div");

    actions.className = "actions";

    actions.innerHTML = `
      <button class="action"
        onclick="copyText(${index})">
        📋
      </button>

      <button class="action"
        onclick="speakText(${index})">
        🔊
      </button>

      <button class="action"
        onclick="regenerate(${index})">
        🔄
      </button>

      <button class="action"
        onclick="feedback('positive')">
        👍
      </button>

      <button class="action"
        onclick="feedback('negative')">
        👎
      </button>
    `;

    container.appendChild(actions);
  }

  wrapper.appendChild(container);

  chat.appendChild(wrapper);
}


/* =========================
   ENVOYER
========================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;

  if(!currentConversation){

    newChat();

  }

  if(currentConversation.title ===
     "Nouvelle conversation"){

    currentConversation.title =
      text.substring(0,35);

  }

  currentConversation.messages.push({
    role:"user",
    content:text
  });

  input.value = "";

  resizeTextarea(input);

  saveConversations();

  renderConversation();

  showTyping();

  sendButton.disabled = true;

  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          messages:
            currentConversation.messages
        })

      });

    let data;

    try{
      data = await response.json();
    }catch{
      throw new Error(
        "Le serveur a renvoyé une réponse invalide."
      );
    }

    if(!response.ok){

      throw new Error(
        data.error ||
        "Erreur du serveur."
      );

    }

    if(!data.answer){

      throw new Error(
        "La réponse de Wiener IA est vide."
      );

    }

    currentConversation.messages.push({
      role:"assistant",
      content:data.answer
    });

    saveConversations();

    hideTyping();

    renderConversation();

  }catch(error){

    hideTyping();

    currentConversation.messages.push({
      role:"assistant",
      content:
        "❌ " + error.message
    });

    saveConversations();

    renderConversation();

  }finally{

    sendButton.disabled = false;

    input.focus();

  }
}


/* =========================
   INDICATEUR
========================= */

function showTyping(){

  hideTyping();

  const wrapper =
    document.createElement("div");

  wrapper.id = "typing";

  wrapper.className =
    "message assistant";

  wrapper.innerHTML = `
    <div class="typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;

  chat.appendChild(wrapper);

  scrollBottom();
}


function hideTyping(){

  const typing =
    document.getElementById("typing");

  if(typing){
    typing.remove();
  }

}


/* =========================
   COPIER
========================= */

function copyText(index){

  const message =
    currentConversation.messages[index];

  if(!message) return;

  navigator.clipboard.writeText(
    message.content
  );

}


/* =========================
   LECTURE VOCALE
========================= */

function speakText(index){

  const message =
    currentConversation.messages[index];

  if(!message) return;

  if(!("speechSynthesis" in window)){
    alert("La lecture vocale n'est pas disponible.");
    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      message.content
    );

  utterance.lang = "fr-FR";

  speechSynthesis.speak(utterance);
}


/* =========================
   DICTÉE VOCALE
========================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "La dictée vocale n'est pas disponible sur ce navigateur."
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "fr-FR";

  recognition.interimResults = false;

  recognition.onresult = event => {

    input.value +=
      event.results[0][0].transcript;

    resizeTextarea(input);

  };

  recognition.start();

}


/* =========================
   REGENERER
========================= */

async function regenerate(index){

  if(index <= 0) return;

  const assistantMessage =
    currentConversation.messages[index];

  if(assistantMessage.role !== "assistant"){
    return;
  }

  currentConversation.messages =
    currentConversation.messages.slice(
      0,index
    );

  saveConversations();

  renderConversation();

  showTyping();

  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          messages:
            currentConversation.messages
        })

      });

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Erreur du serveur."
      );

    }

    currentConversation.messages.push({
      role:"assistant",
      content:data.answer
    });

    saveConversations();

    hideTyping();

    renderConversation();

  }catch(error){

    hideTyping();

    currentConversation.messages.push({
      role:"assistant",
      content:"❌ " + error.message
    });

    saveConversations();

    renderConversation();

  }

}


/* =========================
   FEEDBACK
========================= */

function feedback(type){

  console.log(
    "Feedback Wiener IA :",
    type
  );

}


/* =========================
   THEME
========================= */

function toggleTheme(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "wiener_theme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );

}


/* =========================
   EFFACER HISTORIQUE
========================= */

function clearAllHistory(){

  if(!confirm(
    "Supprimer toutes les conversations ?"
  )){
    return;
  }

  conversations = [];

  localStorage.removeItem(
    "wiener_conversations"
  );

  newChat();

}


/* =========================
   SAUVEGARDE
========================= */

function saveConversations(){

  localStorage.setItem(
    "wiener_conversations",
    JSON.stringify(conversations)
  );

  renderHistory();

}


/* =========================
   CLAVIER
========================= */

function handleKey(event){

  if(event.key === "Enter" &&
     !event.shiftKey){

    event.preventDefault();

    sendMessage();

  }

}


/* =========================
   TEXTAREA
========================= */

function resizeTextarea(element){

  element.style.height = "auto";

  element.style.height =
    Math.min(
      element.scrollHeight,
      180
    ) + "px";

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

  setTimeout(() => {

    chat.scrollTop =
      chat.scrollHeight;

  },50);

}


/* =========================
   SIDEBAR MOBILE
========================= */

function toggleSidebar(){

  sidebar.classList.toggle("open");

}

function closeSidebar(){

  sidebar.classList.remove("open");

}


/* =========================
   DÉMARRAGE
========================= */

init();

</script>

</body>
</html>
```
