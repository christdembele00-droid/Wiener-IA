<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8dth=device-width, initial-scale=1.0">

  <title>Wiener IA – Assistant IA intelligent</title>

  <meta
    name="description"
    content="Wiener IA est un assistant d'intelligence artificielle créé par Dembele Christ pour apprendre, rechercher, résoudre des exercices, analyser des fichiers et créer des images."
  >

  <meta name="author" content="Dembele Christ">
  <meta name="robots" content="index, follow">

  <link
    rel="canonical"
    href="https://wiener-ia.onrender.com/"
  >

  <meta
    property="og:title"
    content="Wiener IA – Assistant IA intelligent"
  >

  <meta
    property="og:description"
    content="Wiener IA, votre assistant IA pour apprendre, rechercher, résoudre des exercices et travailler sur vos projets."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://wiener-ia.onrender.com/"
  >

  <meta name="theme-color" content="#111827">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --sidebar: #f7f7f8;
      --surface: #ffffff;
      --surface2: #f3f4f6;
      --hover: #ececf0;

      --text: #171717;
      --muted: #737373;

      --border: #e5e5e5;

      --accent: #5b5ce2;
      --accent-hover: #4b4cc9;

      --user: #f1f1f1;

      --danger: #dc2626;

      --shadow:
        0 8px 30px rgba(0,0,0,.08);
    }

    body.dark {
      --bg: #171717;
      --sidebar: #101010;
      --surface: #1f1f1f;
      --surface2: #2a2a2a;
      --hover: #303030;

      --text: #f5f5f5;
      --muted: #a3a3a3;

      --border: #353535;

      --accent: #7778f2;
      --accent-hover: #8b8cf5;

      --user: #303030;

      --shadow:
        0 10px 35px rgba(0,0,0,.3);
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);

      overflow: hidden;
    }

    button,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ==============================
       APP
    ============================== */

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* ==============================
       SIDEBAR
    ============================== */

    .sidebar {
      width: 270px;
      height: 100vh;

      background: var(--sidebar);
      border-right: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      padding: 14px;

      flex-shrink: 0;

      transition: transform .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      padding: 8px 8px 20px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #6667e8,
          #8a8bf7
        );

      color: white;

      font-weight: 800;
      font-size: 19px;

      box-shadow:
        0 7px 20px rgba(91,92,226,.25);
    }

    .brand-text {
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -.4px;
    }

    .brand-subtitle {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    .new-chat {
      width: 100%;

      border: 1px solid var(--border);

      background: var(--surface);
      color: var(--text);

      border-radius: 11px;

      padding: 11px 13px;

      font-size: 13px;
      font-weight: 650;

      transition: .15s;
    }

    .new-chat:hover {
      background: var(--hover);
      transform: translateY(-1px);
    }

    .history {
      flex: 1;

      overflow-y: auto;

      margin-top: 20px;
    }

    .history-title {
      color: var(--muted);

      font-size: 10px;
      font-weight: 750;

      text-transform: uppercase;
      letter-spacing: .8px;

      padding: 8px;
    }

    .history-item {
      padding: 10px 11px;

      border-radius: 9px;

      margin-bottom: 2px;

      font-size: 13px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      color: var(--text);

      transition: .15s;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--hover);
    }

    .history-item.active {
      font-weight: 600;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);

      padding-top: 9px;
    }

    .sidebar-button {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 10px;

      border: 0;

      background: transparent;

      color: var(--text);

      padding: 10px;

      border-radius: 9px;

      text-align: left;

      font-size: 13px;

      transition: .15s;
    }

    .sidebar-button:hover {
      background: var(--hover);
    }

    .creator {
      text-align: center;

      color: var(--muted);

      font-size: 10px;

      padding:
        12px 5px 3px;
    }

    .creator strong {
      color: var(--text);
    }

    /* ==============================
       MAIN
    ============================== */

    .main {
      flex: 1;
      min-width: 0;

      height: 100vh;

      display: flex;
      flex-direction: column;

      background: var(--bg);
    }

    /* ==============================
       HEADER
    ============================== */

    .topbar {
      height: 60px;

      flex-shrink: 0;

      display: flex;
      align-items: center;

      padding: 0 22px;

      border-bottom: 1px solid var(--border);
    }

    .mobile-menu {
      display: none;

      width: 38px;
      height: 38px;

      margin-right: 8px;

      border: 0;

      background: transparent;

      color: var(--text);

      border-radius: 9px;

      font-size: 20px;
    }

    .mobile-menu:hover {
      background: var(--hover);
    }

    .top-title {
      font-size: 15px;
      font-weight: 700;
    }

    .online {
      display: flex;
      align-items: center;

      gap: 6px;

      margin-left: 12px;

      color: var(--muted);

      font-size: 11px;
    }

    .online-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #22c55e;

      box-shadow:
        0 0 8px rgba(34,197,94,.4);
    }

    .top-actions {
      margin-left: auto;

      display: flex;
      gap: 4px;
    }

    .top-button {
      width: 36px;
      height: 36px;

      border: 0;

      background: transparent;

      color: var(--muted);

      border-radius: 9px;

      font-size: 16px;
    }

    .top-button:hover {
      background: var(--hover);
      color: var(--text);
    }

    /* ==============================
       CHAT
    ============================== */

    .chat {
      flex: 1;

      overflow-y: auto;

      padding:
        35px
        max(20px, calc((100% - 900px) / 2))
        30px;
    }

    .welcome {
      max-width: 850px;

      min-height: 70vh;

      margin: auto;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .welcome-logo {
      width: 70px;
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #5b5ce2,
          #8586f4
        );

      color: white;

      font-size: 30px;
      font-weight: 850;

      box-shadow:
        0 15px 40px rgba(91,92,226,.22);
    }

    .welcome h1 {
      margin-top: 22px;

      font-size: 36px;

      letter-spacing: -1.5px;
    }

    .welcome h1 span {
      color: var(--accent);
    }

    .welcome p {
      margin-top: 9px;

      color: var(--muted);

      font-size: 14px;
    }

    .creator-big {
      margin-top: 7px;

      color: var(--muted);

      font-size: 11px;
    }

    .creator-big strong {
      color: var(--text);
    }

    .suggestions {
      width: 100%;

      margin-top: 35px;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 11px;
    }

    .suggestion {
      min-height: 100px;

      padding: 17px;

      border: 1px solid var(--border);

      background: var(--surface);

      color: var(--text);

      border-radius: 14px;

      text-align: left;

      transition:
        transform .15s,
        background .15s,
        border-color .15s;
    }

    .suggestion:hover {
      background: var(--hover);

      transform: translateY(-2px);

      border-color: var(--accent);
    }

    .suggestion-icon {
      font-size: 19px;
      margin-bottom: 10px;
    }

    .suggestion-title {
      font-size: 14px;
      font-weight: 700;
    }

    .suggestion-description {
      margin-top: 5px;

      color: var(--muted);

      font-size: 11px;

      line-height: 1.5;
    }

    /* ==============================
       MESSAGES
    ============================== */

    .message {
      display: flex;

      width: 100%;

      margin-bottom: 30px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 820px;
      min-width: 0;
    }

    .user .message-content {
      max-width: min(720px, 82%);
    }

    .bubble {
      font-size: 15px;

      line-height: 1.7;

      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: var(--user);

      border-radius: 18px;

      padding: 12px 16px;

      white-space: pre-wrap;
    }

    .assistant .bubble {
      padding: 2px 0;
    }

    .bubble h1,
    .bubble h2,
    .bubble h3 {
      margin:
        20px 0 10px;

      line-height: 1.3;
    }

    .bubble h1 {
      font-size: 24px;
    }

    .bubble h2 {
      font-size: 20px;
    }

    .bubble h3 {
      font-size: 17px;
    }

    .bubble p {
      margin-bottom: 12px;
    }

    .bubble ul,
    .bubble ol {
      margin:
        8px 0 14px;

      padding-left: 25px;
    }

    .bubble li {
      margin-bottom: 5px;
    }

    .bubble code {
      background: var(--surface2);

      border: 1px solid var(--border);

      border-radius: 5px;

      padding: 2px 5px;

      font-family:
        Consolas,
        monospace;

      font-size: 13px;
    }

    /* ==============================
       CODE
    ============================== */

    .code-block {
      margin: 15px 0;

      overflow: hidden;

      border-radius: 12px;

      background: #111;

      color: #eee;

      border: 1px solid #333;
    }

    .code-header {
      height: 37px;

      display: flex;
      align-items: center;

      padding: 0 11px;

      background: #1c1c1c;

      border-bottom: 1px solid #333;

      color: #aaa;

      font-size: 11px;
    }

    .code-copy {
      margin-left: auto;

      border: 0;

      background: transparent;

      color: #aaa;

      padding: 5px 8px;

      border-radius: 5px;
    }

    .code-copy:hover {
      background: #303030;
      color: white;
    }

    .code-block pre {
      margin: 0;

      padding: 15px;

      overflow-x: auto;

      font-family:
        Consolas,
        monospace;

      font-size: 13px;

      line-height: 1.55;
    }

    /* ==============================
       ACTIONS
    ============================== */

    .actions {
      display: flex;

      gap: 2px;

      margin-top: 8px;
    }

    .action {
      width: 31px;
      height: 30px;

      border: 0;

      background: transparent;

      color: var(--muted);

      border-radius: 7px;

      font-size: 13px;
    }

    .action:hover {
      background: var(--hover);

      color: var(--text);
    }

    /* ==============================
       SOURCES
    ============================== */

    .sources {
      display: flex;

      flex-direction: column;

      gap: 6px;

      margin-top: 13px;
    }

    .source-title {
      color: var(--muted);

      font-size: 10px;

      font-weight: 750;

      text-transform: uppercase;
    }

    .source-link {
      color: var(--accent);

      font-size: 12px;

      text-decoration: none;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    /* ==============================
       IMAGE
    ============================== */

    .generated-image {
      max-width: 100%;

      display: block;

      margin-top: 10px;

      border-radius: 14px;

      border: 1px solid var(--border);

      box-shadow: var(--shadow);
    }

    /* ==============================
       TYPING
    ============================== */

    .typing {
      display: flex;

      align-items: center;

      gap: 5px;

      padding: 8px 0;
    }

    .typing-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--muted);

      animation: typing 1.2s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 80%, 100% {
        opacity: .3;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* ==============================
       COMPOSER
    ============================== */

    .composer-area {
      flex-shrink: 0;

      padding:
        8px
        max(18px, calc((100% - 930px) / 2))
        15px;
    }

    .composer {
      background: var(--surface);

      border: 1px solid var(--border);

      border-radius: 17px;

      box-shadow: var(--shadow);

      padding: 8px;
    }

    .mode-bar {
      display: flex;

      gap: 5px;

      padding:
        0 4px 7px;

      overflow-x: auto;
    }

    .mode {
      border: 1px solid var(--border);

      background: var(--surface);

      color: var(--muted);

      border-radius: 8px;

      padding: 5px 9px;

      font-size: 11px;

      white-space: nowrap;
    }

    .mode:hover,
    .mode.active {
      background: var(--surface2);

      color: var(--text);

      border-color: var(--accent);
    }

    .attachments {
      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      padding:
        2px 5px 7px;
    }

    .attachment {
      display: flex;

      align-items: center;

      gap: 7px;

      max-width: 240px;

      padding: 6px 8px;

      background: var(--surface2);

      border: 1px solid var(--border);

      border-radius: 9px;

      font-size: 11px;
    }

    .attachment-name {
      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .remove-file {
      border: 0;

      background: transparent;

      color: var(--muted);

      font-size: 14px;
    }

    .composer-row {
      display: flex;

      align-items: flex-end;

      gap: 4px;
    }

    .tool {
      flex-shrink: 0;

      width: 39px;
      height: 39px;

      border: 0;

      background: transparent;

      color: var(--muted);

      border-radius: 9px;

      font-size: 17px;
    }

    .tool:hover {
      background: var(--hover);

      color: var(--text);
    }

    .textarea {
      flex: 1;

      resize: none;

      border: 0;

      outline: 0;

      background: transparent;

      color: var(--text);

      font-size: 15px;

      line-height: 1.5;

      min-height: 40px;

      max-height: 180px;

      padding: 9px 7px;
    }

    .textarea::placeholder {
      color: var(--muted);
    }

    .send {
      flex-shrink: 0;

      width: 40px;
      height: 40px;

      border: 0;

      border-radius: 11px;

      background: var(--accent);

      color: white;

      font-size: 18px;

      transition: .15s;
    }

    .send:hover:not(:disabled) {
      background: var(--accent-hover);

      transform: translateY(-1px);
    }

    .send:disabled {
      opacity: .45;

      cursor: not-allowed;
    }

    .composer-info {
      display: flex;

      align-items: center;

      gap: 10px;

      padding:
        4px 5px 0;

      color: var(--muted);

      font-size: 9px;
    }

    .file-info {
      flex: 1;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .disclaimer {
      text-align: center;

      color: var(--muted);

      font-size: 9px;

      margin-top: 7px;
    }

    /* ==============================
       MODAL
    ============================== */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,0,.45);

      backdrop-filter: blur(5px);
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: min(470px, 100%);

      background: var(--surface);

      border: 1px solid var(--border);

      border-radius: 17px;

      padding: 20px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.25);
    }

    .modal-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 8px;
    }

    .modal-header h2 {
      font-size: 18px;
    }

    .modal-close {
      width: 34px;
      height: 34px;

      border: 0;

      background: transparent;

      color: var(--muted);

      border-radius: 8px;

      font-size: 20px;
    }

    .modal-close:hover {
      background: var(--hover);
    }

    .setting {
      padding: 14px 0;

      border-bottom: 1px solid var(--border);
    }

    .setting:last-child {
      border-bottom: 0;
    }

    .setting label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 650;
    }

    .setting select {
      width: 100%;

      border: 1px solid var(--border);

      border-radius: 9px;

      background: var(--surface);

      color: var(--text);

      padding: 9px;

      outline: none;
    }

    /* ==============================
       TOAST
    ============================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform:
        translate(-50%, 20px);

      opacity: 0;

      pointer-events: none;

      z-index: 2000;

      background: #222;

      color: white;

      padding: 10px 14px;

      border-radius: 9px;

      font-size: 12px;

      transition: .25s;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 800px) {

      .sidebar {
        position: fixed;

        left: 0;
        top: 0;
        bottom: 0;

        z-index: 900;

        transform:
          translateX(-100%);

        box-shadow:
          10px 0 30px rgba(0,0,0,.2);
      }

      .sidebar.open {
        transform:
          translateX(0);
      }

      .mobile-menu {
        display: block;
      }

      .topbar {
        padding: 0 10px;
      }

      .online {
        display: none;
      }

      .chat {
        padding:
          20px 13px 25px;
      }

      .welcome {
        min-height: 65vh;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .composer-area {
        padding:
          6px 8px 11px;
      }

      .composer-info span {
        display: none;
      }

      .user .message-content {
        max-width: 90%;
      }

      .bubble {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <div class="brand-logo">
        W
      </div>

      <div>
        <div class="brand-text">
          Wiener IA
        </div>

        <div class="brand-subtitle">
          Assistant intelligent
        </div>
      </div>

    </div>

    <button
      class="new-chat"
      onclick="newChat()"
    >
      ＋ Nouvelle conversation
    </button>

    <div class="history">

      <div class="history-title">
        Conversations
      </div>

      <div id="historyList"></div>

    </div>

    <div class="sidebar-bottom">

      <button
        class="sidebar-button"
        onclick="openSettings()"
      >
        ⚙️
        <span>Paramètres</span>
      </button>

      <button
        class="sidebar-button"
        onclick="toggleTheme()"
      >
        ◐
        <span>Changer le thème</span>
      </button>

      <button
        class="sidebar-button"
        onclick="exportConversation()"
      >
        ⇩
        <span>Exporter</span>
      </button>

      <button
        class="sidebar-button"
        onclick="clearAllHistory()"
      >
        🗑
        <span>Effacer l'historique</span>
      </button>

    </div>

    <div class="creator">
      Wiener IA créé par
      <strong>Dembele Christ</strong>
    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button
        class="mobile-menu"
        onclick="toggleSidebar()"
      >
        ☰
      </button>

      <div class="top-title">
        Wiener IA
      </div>

      <div class="online">

        <span class="online-dot"></span>

        <span id="statusText">
          Prêt
        </span>

      </div>

      <div class="top-actions">

        <button
          class="top-button"
          title="Nouvelle conversation"
          onclick="newChat()"
        >
          ＋
        </button>

        <button
          class="top-button"
          title="Paramètres"
          onclick="openSettings()"
        >
          ⚙
        </button>

      </div>

    </header>


    <!-- CHAT -->

    <div
      class="chat"
      id="chat"
    ></div>


    <!-- COMPOSER -->

    <div class="composer-area">

      <div class="composer">

        <div

/* ==========================================

========================================== */

function renderConversation() {

  chat.innerHTML = "";


  if (
    !currentConversation ||
    !currentConversation.messages ||
    currentConversation.messages.length === 0
  ) {

    renderWelcome();

    return;

  }


  currentConversation.messages.forEach(
    (message, index) => {

/* ==========================================
   MESSAGE
========================================== */

function addMessageToScreen(
  role,
  content,
  index,
  sources = [],
  image = null
) {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "message " + role;


  const container =
    document.createElement(
      "div"
    );

  container.className =
    "message-content";


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  if (role === "assistant") {

    bubble.innerHTML =
      renderMarkdown(content);

  } else {

    bubble.textContent =
      content;

  }


  container.appendChild(
    bubble
  );


  if (image) {

    const img =
      document.createElement(
        "img"
      );

    img.className =
      "generated-image";

    img.src =
      image;

    img.alt =
      "Image générée par Wiener IA";

    container.appendChild(
      img
    );

  }


  if (
    role === "assistant" &&
    sources &&
    sources.length
  ) {

    const sourceContainer =
      document.createElement(
        "div"
      );

    sourceContainer.className =
      "sources";


    const title =
      document.createElement(
        "div"
      );

    title.className =
      "source-title";

    title.textContent =
      "Sources";


    sourceContainer.appendChild(
      title
    );


    sources.forEach(
      source => {

        if (!source.url) return;


        const link =
          document.createElement(
            "a"
          );

        link.className =
          "source-link";

        link.href =
          source.url;

        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";

        link.textContent =
          source.title ||
          source.url;


        sourceContainer.appendChild(
          link
        );

      }
    );


    container.appendChild(
      sourceContainer
    );

  }


  if (role === "assistant") {

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "actions";


    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "action";

    copy.title =
      "Copier";

    copy.textContent =
      "📋";

    copy.onclick =
      () => copyText(index);


    const speak =
      document.createElement(
        "button"
      );

    speak.className =
      "action";

    speak.title =
      "Lire";

    speak.textContent =
      "🔊";

    speak.onclick =
      () => speakText(index);


    const regenerateButton =
      document.createElement(
        "button"
      );

    regenerateButton.className =
      "action";

    regenerateButton.title =
      "Régénérer";

    regenerateButton.textContent =
      "↻";

    regenerateButton.onclick =
      () => regenerate(index);


    actions.appendChild(copy);

    actions.appendChild(speak);

    actions.appendChild(
      regenerateButton
    );


    container.appendChild(
      actions
    );

  }


  wrapper.appendChild(
    container
  );


  chat.appendChild(
    wrapper
  );

}


/* ==========================================
   MARKDOWN
========================================== */

function renderMarkdown(text) {

  if (!text) return "";


  let safe =
    escapeHTML(text);


  const codeBlocks = [];


  safe =
    safe.replace(
      /```([\s\S]*?)```/g,
      function(match, code) {

        const id =
          codeBlocks.length;

        codeBlocks.push(code);

        return `@@CODE_${id}@@`;

      }
    );


  safe =
    safe.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );


  safe =
    safe.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );


  safe =
    safe.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );


  safe =
    safe.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  safe =
    safe.replace(
      /\*(.*?)\*/g,
      "<em>$1</em>"
    );


  safe =
    safe.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  safe =
    safe.replace(
      /^[-•] (.*)$/gm,
      "<li>$1</li>"
    );


  safe =
    safe.replace(
      /(<li>.*<\/li>)/gs,
      "<ul>$1</ul>"
    );


  safe =
    safe.replace(
      /\n{2,}/g,
      "</p><p>"
    );


  safe =
    "<p>" +
    safe +
    "</p>";


  safe =
    safe.replace(
      /<p>\s*(<h[123]>)/g,
      "$1"
    );


  safe =
    safe.replace(
      /(<\/h[123]>)\s*<\/p>/g,
      "$1"
    );


  safe =
    safe.replace(
      /<p>\s*(<ul>)/g,
      "$1"
    );


  safe =
    safe.replace(
      /(<\/ul>)\s*<\/p>/g,
      "$1"
    );


  codeBlocks.forEach(
    (code, index) => {

      const html = `

        <div class="code-block">

          <div class="code-header">

            <span>Code</span>

            <button
              class="code-copy"
              onclick="copyCode(${index},this)"
            >
              Copier
            </button>

          </div>

          <pre>${escapeHTML(
            code.trim()
          )}</pre>

        </div>

      `;


      safe =
        safe.replace(
          `@@CODE_${index}@@`,
          html
        );

    }
  );


  return safe;

}


/* ==========================================
   API
========================================== */

async function sendMessage() {

  if (busy) return;


  const text =
    input.value.trim();


  if (
    !text &&
    selectedFiles.length === 0
  ) {
    return;
  }


  if (!currentConversation) {
    createConversation();
  }


  if (
    currentConversation.title ===
    "Nouvelle conversation"
  ) {

    currentConversation.title =
      text
        ? text.substring(0, 45)
        : "Nouvelle conversation";

  }


  busy = true;

  sendButton.disabled = true;

  statusText.textContent =
    "Réflexion...";


  const filesToSend =
    [...selectedFiles];


  if (text) {

    currentConversation.messages.push({

      role: "user",

      content: text

    });

  }


  input.value = "";

  resizeTextarea(input);

  renderAttachments();

  saveConversations();

  renderConversation();

  showTyping();


  try {

    let result;


    if (currentMode === "search") {

      result =
        await requestSearch(text);

    }

    else if (currentMode === "exercise") {

      result =
        await requestExercise(text);

    }

    else if (currentMode === "image") {

      result =
        await requestImage(text);

    }

    else if (filesToSend.length) {

      result =
        await requestFiles(
          filesToSend,
          text
        );

    }

    else {

      result =
        await requestChat();

    }


    hideTyping();


    if (
      !result ||
      !result.answer
    ) {

      throw new Error(
        "Wiener IA n'a retourné aucune réponse."
      );

    }


    currentConversation.messages.push({

      role: "assistant",

      content:
        result.answer,

      sources:
        result.sources || [],

      image:
        result.image || null

    });


    saveConversations();

    renderConversation();


    if (
      localStorage.getItem(
        "wiener_auto_speak"
      ) === "yes"
    ) {

      speakContent(
        result.answer
      );

    }


  } catch (error) {

    hideTyping();


    currentConversation.messages.push({

      role: "assistant",

      content:
        "❌ " +
        (
          error.message ||
          "Une erreur est survenue."
        )

    });


    saveConversations();

    renderConversation();

  }


  selectedFiles = [];

  renderAttachments();


  busy = false;

  sendButton.disabled = false;

  statusText.textContent =
    "Prêt";

  input.focus();

}


/* ==========================================
   CHAT REQUEST
========================================== */

async function requestChat() {

  const response =
    await fetch(
      "/api/chat",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          messages:
            currentConversation.messages

        })

      }
    );


  return readResponse(
    response
  );

}


/* ==========================================
   SEARCH
========================================== */

async function requestSearch(
  query
) {

  if (!query) {

    throw new Error(
      "Écris une question à rechercher."
    );

  }


  const response =
    await fetch(
      "/api/search",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          query
        })

      }
    );


  return readResponse(
    response
  );

}


/* ==========================================
   EXERCISE
========================================== */

async function requestExercise(
  question
) {

  if (!question) {

    throw new Error(
      "Écris l'exercice à résoudre."
    );

  }


  const response =
    await fetch(
      "/api/exercises",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          question,

          level: "Terminale",

          subject: "non précisée"

        })

      }
    );


  return readResponse(
    response
  );

}


/* ==========================================
   IMAGE
========================================== */

async function requestImage(
  prompt
) {

  if (!prompt) {

    throw new Error(
      "Décris l'image que tu veux créer."
    );

  }


  const response =
    await fetch(
      "/api/image",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          prompt
        })

      }
    );


  return readResponse(
    response
  );

}


/* ==========================================
   FILES
========================================== */

async function requestFiles(
  files,
  prompt
) {

  const file =
    files[0];


  if (files.length > 1) {

    throw new Error(
      "Sélectionne un seul fichier."
    );

  }


  if (
    file.size >
    30 * 1024 * 1024
  ) {

    throw new Error(
      "Le fichier dépasse 30 MB."
    );

  }


  const base64 =
    await fileToBase64(file);


  const response =
    await fetch(
      "/api/analyze-file",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          file: base64,

          mimeType:
            file.type ||
            guessMimeType(
              file.name
            ),

          prompt:
            prompt ||
            "Analyse ce fichier et explique clairement les informations importantes."

        })

      }
    );


  return readResponse(
    response
  );

}


/* ==========================================
   RESPONSE
========================================== */

async function readResponse(
  response
) {

  let data;


  try {

    data =
      await response.json();

  } catch {

    throw new Error(
      "Le serveur a renvoyé une réponse invalide."
    );

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      `Erreur serveur (${response.status}).`
    );

  }


  return data;

}


/* ==========================================
   TYPING
========================================== */

function showTyping() {

  hideTyping();


  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.id =
    "typing";

  wrapper.className =
    "message assistant";


  wrapper.innerHTML = `

    <div class="message-content">

      <div class="typing">

        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>

      </div>

    </div>

  `;


  chat.appendChild(
    wrapper
  );


  scrollBottom();

}


function hideTyping() {

  const typing =
    document.getElementById(
      "typing"
    );

  if (typing) {
    typing.remove();
  }

}


/* ==========================================
   COPY
========================================== */

async function copyText(
  index
) {

  const message =
    currentConversation?.messages[index];


  if (!message) return;


  try {

    await navigator.clipboard.writeText(
      message.content
    );

    showToast(
      "Réponse copiée"
    );

  } catch {

    showToast(
      "Copie impossible"
    );

  }

}


function copyCode(
  index,
  button
) {

  const block =
    button.closest(
      ".code-block"
    );


  if (!block) return;


  const code =
    block.querySelector(
      "pre"
    )?.textContent || "";


  navigator.clipboard
    .writeText(code)
    .then(
      () => showToast("Code copié")
    )
    .catch(
      () => showToast("Copie impossible")
    );

}


/* ==========================================
   VOICE
========================================== */

function speakText(
  index
) {

  const message =
    currentConversation?.messages[index];


  if (!message) return;


  speakContent(
    message.content
  );

}


function speakContent(
  text
) {

  if (
    !("speechSynthesis" in window)
  ) {

    showToast(
      "Lecture vocale indisponible"
    );

    return;

  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    document.getElementById(
      "languageSelect"
    ).value;


  utterance.rate =
    .95;


  speechSynthesis.speak(
    utterance
  );

}


/* ==========================================
   DICTÉE
========================================== */

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    showToast(
      "Dictée vocale indisponible."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    document.getElementById(
      "languageSelect"
    ).value;


  recognition.interimResults =
    false;

  recognition.continuous =
    false;


  statusText.textContent =
    "Écoute...";


  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0]
          .transcript;


      input.value +=
        (
          input.value
            ? " "
            : ""
        ) +
        transcript;


      resizeTextarea(
        input
      );


      statusText.textContent =
        "Prêt";

    };


  recognition.onerror =
    () => {

      statusText.textContent =
        "Prêt";

      showToast(
        "Erreur de dictée"
      );

    };


  recognition.onend =
    () => {

      statusText.textContent =
        "Prêt";

    };


  recognition.start();

}


/* ==========================================
   FILES
========================================== */

function chooseFile() {

  fileInput.click();

}


function handleFiles(
  event
) {

  const files =
    Array.from(
      event.target.files
    );


  if (!files.length) return;


  selectedFiles =
    files.slice(0, 1);


  renderAttachments();

  fileInput.value = "";

}


function renderAttachments() {

  attachments.innerHTML = "";


  selectedFiles.forEach(
    (file, index) => {

      const element =
        document.createElement(
          "div"
        );

      element.className =
        "attachment";


      element.innerHTML = `

        <span>📎</span>

        <span class="attachment-name">
          ${escapeHTML(file.name)}
        </span>

        <button
          class="remove-file"
          onclick="removeFile(${index})"
        >
          ×
        </button>

      `;


      attachments.appendChild(
        element
      );

    }
  );


  const info =
    document.getElementById(
      "fileInfo"
    );


  info.textContent =
    selectedFiles.length
      ? selectedFiles[0].name
      : "";

}


function removeFile(
  index
) {

  selectedFiles.splice(
    index,
    1
  );

  renderAttachments();

}


function fileToBase64(
  file
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => resolve(
          reader.result
        );


      reader.onerror =
        () => reject(
          new Error(
            "Impossible de lire le fichier."
          )
        );


      reader.readAsDataURL(
        file
      );

    }
  );

}


function guessMimeType(
  filename
) {

  const ext =
    filename
      .split(".")
      .pop()
      .toLowerCase();


  const types = {

    pdf:
      "application/pdf",

    png:
      "image/png",

    jpg:
      "image/jpeg",

    jpeg:
      "image/jpeg",

    webp:
      "image/webp",

    txt:
      "text/plain",

    csv:
      "text/csv",

    json:
      "application/json"

  };


  return (
    types[ext] ||
    "application/octet-stream"
  );

}


/* ==========================================
   MODES
========================================== */

function setMode(
  mode,
  button
) {

  currentMode =
    mode;


  document
    .querySelectorAll(".mode")
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  if (button) {

    button.classList.add(
      "active"
    );

  }


  const placeholders = {

    chat:
      "Message à Wiener IA...",

    search:
      "Que voulez-vous rechercher ?",

    exercise:
      "Collez votre exercice ici...",

    image:
      "Décrivez l'image à générer..."

  };


  input.placeholder =
    placeholders[mode];


  input.focus();

}


/* ==========================================
   SUGGESTION
========================================== */

function useSuggestion(
  text
) {

  input.value =
    text;


  resizeTextarea(
    input
  );


  input.focus();

}


/* ==========================================
   THEME
========================================== */

function toggleTheme() {

  const dark =
    document.body.classList.contains(
      "dark"
    );


  setTheme(
    dark
      ? "light"
      : "dark"
  );

}


function setTheme(
  theme
) {

  document.body.classList.toggle(
    "dark",
    theme === "dark"
  );


  localStorage.setItem(
    "wiener_theme",
    theme
  );


  const select =
    document.getElementById(
      "themeSelect"
    );


  if (select) {

    select.value =
      theme;

  }

}


/* ==========================================
   SETTINGS
========================================== */

function openSettings() {

  document
    .getElementById(
      "settingsModal"
    )
    .classList.add(
      "open"
    );

}


function closeSettings() {

  document
    .getElementById(
      "settingsModal"
    )
    .classList.remove(
      "open"
    );

}


document
  .getElementById(
    "languageSelect"
  )
  .addEventListener(

      localStorage.setItem(

        event.target.value
      );

    }
  );


document
  .getElementById(

  )
  .addEventListener(
    "change",
    event => {

      localStorage.setItem(
        "wiener_auto_speak",
        event.target.value
      );

    }
  );


document
  .getElementById(
    "settingsModal"
  )
  .addEventListener(

    event => {

      if (
        event.target.id ===

      ) {

  );


/* ==========================================
   EXPORT
========================================== */

function exportConversation() {

  if (
    !currentConversation ||
    !currentConversation.messages.length
  ) {

    showToast(
      "Conversation vide"
    );

    return;

  }


  let content =
    "# " +
    currentConversation.title +
    "\n\n";


  currentConversation.messages.forEach(
    message => {

      const author =
        message.role === "user"
          ? "Vous"
          : "Wiener IA";


      content +=
        "## " +
        author +
        "\n\n" +
        message.content +
        "\n\n";

    }
  );


  const blob =
    new Blob(
      [content],
      {
        type:
          "text/markdown;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    (
      currentConversation.title
        .replace(
          /[^a-z0-9]/gi,
          "_"
        ) ||
      "wiener_conversation"
    ) +
    ".md";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(
    url
  );


  showToast(
    "Conversation exportée"
  );

}


/* ==========================================
   CLEAR HISTORY
========================================== */

function clearAllHistory() {

  if (!conversations.length) {
    return;
  }


  if (
    !confirm(
      "Supprimer toutes les conversations ?"
    )
  ) {
    return;
  }


  conversations = [];


  localStorage.removeItem(
    "wiener_conversations"
  );


  createConversation();

  renderHistory();

  renderConversation();


  showToast(
    "Historique supprimé"
  );

}


/* ==========================================
   SAVE
========================================== */

function saveConversations() {

  localStorage.setItem(
    "wiener_conversations",
    JSON.stringify(
      conversations
    )
  );


  renderHistory();

}


/* ==========================================
   REGENERATE
========================================== */

async function regenerate(
  index
) {

  if (busy) return;


  if (
    !currentConversation ||
    !currentConversation.messages[index]
  ) {
    return;
  }


  if (
    currentConversation.messages[index].role !==
    "assistant"
  ) {
    return;
  }


  currentConversation.messages =
    currentConversation.messages.slice(
      0,
      index
    );


  saveConversations();

  renderConversation();

  showTyping();


  busy = true;

  sendButton.disabled = true;

  statusText.textContent =
    "Régénération...";


  try {

    const result =
      await requestChat();


    hideTyping();


    if (!result.answer) {

      throw new Error(
        "Réponse vide."
      );

    }


    currentConversation.messages.push({

      role: "assistant",

      content:
        result.answer

    });


    saveConversations();

    renderConversation();


  } catch (error) {

    hideTyping();


    currentConversation.messages.push({

      role: "assistant",

      content:
        "❌ " +
        error.message

    });


    saveConversations();

    renderConversation();

  }


  busy = false;

  sendButton.disabled = false;

  statusText.textContent =
    "Prêt";

}


/* ==========================================
   KEYBOARD
========================================== */

function handleKey(
  event
) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();

  }

}


function resizeTextarea(
  element
) {

  element.style.height =
    "auto";


  element.style.height =
    Math.min(
      element.scrollHeight,
      180
    ) +
    "px";

}


/* ==========================================
   SCROLL
========================================== */

function scrollBottom() {

  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


/* ==========================================
   SIDEBAR
========================================== */

function toggleSidebar() {

  sidebar.classList.toggle(
    "open"
  );

}


function closeSidebar() {

  sidebar.classList.remove(
    "open"
  );

}


/* ==========================================
   TOAST
========================================== */

let toastTimer = null;


function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(
  text
) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==========================================
   RACCOURCIS
========================================== */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeSettings();

      closeSidebar();

    }


    if (
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() ===
        "k"
    ) {

      event.preventDefault();

      newChat();

    }

  }
);


/* ==========================================
   START
========================================== */

init();

</script>
