<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wiener IA - Intelligence artificielle moderne créée par Dembele Christ.">
  <meta name="author" content="Dembele Christ">
  <meta name="theme-color" content="#000000">
  <title>Wiener IA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo-box"><div class="logo-circle">W</div><div class="logo-text"><h1>Wiener IA</h1><p>Créée par Dembele Christ</p></div></div>
    <button class="new-chat-btn" id="newChatBtn" type="button"><span>＋</span> Nouvelle conversation</button>
    <div class="history-head"><span>Historique</span><button id="clearHistoryBtn" type="button" title="Effacer l'historique" aria-label="Effacer l'historique">×</button></div>
    <nav class="history-list" id="historyList" aria-label="Historique des conversations"></nav>
    <div class="sidebar-footer"><div>Wiener IA</div><small>Version 3.0</small></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="topbar-left"><button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Ouvrir le menu" aria-expanded="false">☰</button><div class="title">Wiener IA</div></div><div class="status"><span class="status-dot"></span><span>En ligne</span></div></header>
    <section class="chat-container" id="chatContainer"><div id="messages" class="messages"><div class="message assistant"><div class="message-content">👋 Bonjour !<br><br>Je suis <strong>Wiener IA</strong>.<br><br>Je peux vous aider avec vos questions, vos exercices, vos recherches, vos documents et bien plus encore.</div></div></div></section>
    <div class="file-preview" id="filePreview" hidden><div class="file-info"><span class="file-icon" id="fileIcon">📄</span><div><strong id="fileName">Aucun fichier</strong><small id="fileSize">0 KB</small></div></div><button type="button" id="removeFileBtn" class="remove-file-btn" aria-label="Supprimer le fichier">×</button></div>
    <footer class="input-area"><div class="input-container"><button type="button" id="plusBtn" class="plus-btn" title="Outils et modes" aria-label="Outils et modes" aria-expanded="false">＋</button><div class="plus-menu" id="plusMenu" hidden><button type="button" data-mode="chat">Chat IA</button><button type="button" data-mode="exercise">Exercices</button><button type="button" data-mode="search">Recherche Web</button><button type="button" data-mode="image">Génération d'images</button><button type="button" data-mode="pdf">Analyse PDF</button><button type="button" data-mode="calculator">Calculatrice</button><button type="button" id="plusFileBtn">Ajouter un fichier</button></div><input type="file" id="fileInput" accept=".pdf,application/pdf,image/png,image/jpeg,image/webp" hidden><textarea id="userInput" placeholder="Envoyez un message à Wiener IA..." rows="1" maxlength="20000"></textarea><button id="voiceBtn" type="button" class="voice-btn" title="Parler à Wiener IA" aria-label="Activer la saisie vocale"><span aria-hidden="true">🎙</span></button><button id="sendBtn" type="button" class="send-btn"><span class="send-text">Envoyer</span><span class="send-icon">➤</span></button></div></footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
