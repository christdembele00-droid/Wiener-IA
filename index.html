````html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wiener IA</title>

<style>
/* =========================================================
   WIENER IA — INTERFACE V2
========================================================= */

*{
  box-sizing:border-box;
}

:root{
  --bg:#ffffff;
  --sidebar:#f8f8fa;
  --surface:#ffffff;
  --surface-soft:#f4f4f6;
  --surface-hover:#ececef;

  --text:#17171a;
  --muted:#777780;

  --border:#e5e5e9;

  --accent:#5b5ce2;
  --accent-hover:#4c4dcc;

  --user:#f1f1f4;

  --danger:#d92d20;

  --shadow:0 4px 20px rgba(0,0,0,.06);
}

body.dark{
  --bg:#171719;
  --sidebar:#111113;
  --surface:#1c1c1f;
  --surface-soft:#29292d;
  --surface-hover:#303035;

  --text:#f5f5f7;
  --muted:#a1a1aa;

  --border:#34343a;

  --accent:#7778f2;
  --accent-hover:#898af8;

  --user:#2b2b30;

  --shadow:0 5px 25px rgba(0,0,0,.25);
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:var(--bg);
  color:var(--text);

  overflow:hidden;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  height:100vh;
  display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:275px;
  height:100vh;

  background:var(--sidebar);
  border-right:1px solid var(--border);

  display:flex;
  flex-direction:column;

  padding:14px;

  flex-shrink:0;

  transition:
    transform .25s ease,
    width .25s ease;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px 8px 18px;

  font-weight:700;
  font-size:18px;
}

.brand-symbol{
  width:34px;
  height:34px;

  border-radius:11px;

  background:var(--accent);
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:17px;
  font-weight:800;

  box-shadow:
    0 5px 15px rgba(91,92,226,.25);
}

.brand-name{
  letter-spacing:-.3px;
}

.new-chat{
  width:100%;

  border:1px solid var(--border);
  background:var(--surface);

  color:var(--text);

  border-radius:12px;

  padding:11px 13px;

  font-size:14px;
  font-weight:600;

  cursor:pointer;

  transition:.18s;
}

.new-chat:hover{
  background:var(--surface-hover);
  transform:translateY(-1px);
}

.history{
  flex:1;
  overflow-y:auto;
  margin-top:18px;
}

.history-label{
  padding:8px 9px;

  font-size:11px;
  font-weight:700;

  color:var(--muted);

  text-transform:uppercase;
  letter-spacing:.8px;
}

.history-item{
  position:relative;

  padding:10px 11px;

  border-radius:10px;

  cursor:pointer;

  margin-bottom:3px;

  font-size:13px;

  color:var(--text);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  transition:.15s;
}

.history-item:hover{
  background:var(--surface-hover);
}

.history-item.active{
  background:var(--surface-hover);
  font-weight:600;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:10px;
}

.sidebar-button{
  width:100%;

  display:flex;
  align-items:center;
  gap:10px;

  border:0;
  background:transparent;

  color:var(--text);

  padding:10px 9px;

  border-radius:9px;

  cursor:pointer;

  font-size:13px;

  text-align:left;

  transition:.15s;
}

.sidebar-button:hover{
  background:var(--surface-hover);
}

/* =========================================================
   MAIN
========================================================= */

.main{
  flex:1;
  min-width:0;

  height:100vh;

  display:flex;
  flex-direction:column;

  background:var(--bg);
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
  height:60px;

  flex-shrink:0;

  display:flex;
  align-items:center;

  padding:0 20px;

  border-bottom:1px solid var(--border);

  gap:12px;
}

.mobile-menu{
  display:none;

  width:38px;
  height:38px;

  border:0;
  background:transparent;

  color:var(--text);

  border-radius:9px;

  cursor:pointer;

  font-size:20px;
}

.mobile-menu:hover{
  background:var(--surface-hover);
}

.top-title{
  font-size:16px;
  font-weight:700;
}

.top-status{
  display:flex;
  align-items:center;
  gap:6px;

  color:var(--muted);

  font-size:12px;
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#43a047;
}

.top-actions{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:4px;
}

.top-button{
  border:0;
  background:transparent;

  color:var(--muted);

  width:36px;
  height:36px;

  border-radius:9px;

  cursor:pointer;

  font-size:16px;
}

.top-button:hover{
  background:var(--surface-hover);
  color:var(--text);
}

/* =========================================================
   CHAT
========================================================= */

.chat{
  flex:1;

  overflow-y:auto;

  padding:
    30px
    max(18px, calc((100% - 900px) / 2))
    40px;

  scroll-behavior:smooth;
}

.message{
  display:flex;

  width:100%;

  margin-bottom:30px;
}

.message.user{
  justify-content:flex-end;
}

.message-content{
  width:auto;
  max-width:820px;
  min-width:0;
}

.user .message-content{
  max-width:min(720px,80%);
}

.bubble{
  line-height:1.7;

  font-size:15px;

  overflow-wrap:anywhere;
}

.user .bubble{
  background:var(--user);

  border-radius:18px;

  padding:12px 16px;

  white-space:pre-wrap;
}

.assistant .bubble{
  padding:2px 0;

  white-space:normal;
}

/* =========================================================
   MARKDOWN
========================================================= */

.bubble h1,
.bubble h2,
.bubble h3{
  margin:
    20px 0 10px;

  line-height:1.3;
}

.bubble h1{
  font-size:24px;
}

.bubble h2{
  font-size:20px;
}

.bubble h3{
  font-size:17px;
}

.bubble p{
  margin:0 0 12px;
}

.bubble p:last-child{
  margin-bottom:0;
}

.bubble ul,
.bubble ol{
  margin:
    8px 0 14px;

  padding-left:25px;
}

.bubble li{
  margin-bottom:5px;
}

.bubble strong{
  font-weight:700;
}

.bubble code{
  background:var(--surface-soft);

  border:1px solid var(--border);

  border-radius:5px;

  padding:2px 5px;

  font-family:
    "SFMono-Regular",
    Consolas,
    monospace;

  font-size:13px;
}

.code-block{
  position:relative;

  margin:14px 0;

  border:
    1px solid var(--border);

  border-radius:11px;

  overflow:hidden;

  background:#111;

  color:#eee;
}

.code-header{
  height:35px;

  display:flex;
  align-items:center;

  padding:0 10px;

  background:#1d1d20;

  border-bottom:1px solid #333;

  font-size:11px;

  color:#aaa;
}

.code-copy{
  margin-left:auto;

  border:0;

  background:transparent;

  color:#aaa;

  cursor:pointer;

  padding:4px 8px;

  border-radius:5px;
}

.code-copy:hover{
  background:#303035;
  color:white;
}

.code-block pre{
  margin:0;

  padding:15px;

  overflow-x:auto;

  font-family:
    "SFMono-Regular",
    Consolas,
    monospace;

  font-size:13px;

  line-height:1.55;
}

/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:flex;
  align-items:center;

  gap:2px;

  margin-top:8px;
}

.action{
  border:0;
  background:transparent;

  color:var(--muted);

  width:31px;
  height:30px;

  border-radius:7px;

  cursor:pointer;

  font-size:14px;
}

.action:hover{
  background:var(--surface-hover);
  color:var(--text);
}

.message-time{
  font-size:10px;
  color:var(--muted);
  margin-top:5px;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
  max-width:850px;

  min-height:70vh;

  margin:
    5vh auto 0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.welcome-symbol{
  width:62px;
  height:62px;

  border-radius:19px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--accent);

  color:white;

  font-size:28px;
  font-weight:800;

  box-shadow:
    0 10px 30px rgba(91,92,226,.22);
}

.welcome h1{
  font-size:34px;

  letter-spacing:-1px;

  margin:
    20px 0 8px;
}

.welcome p{
  margin:0;

  color:var(--muted);

  font-size:15px;
}

.suggestions{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-top:32px;
}

.suggestion{
  min-height:82px;

  text-align:left;

  padding:15px;

  border:
    1px solid var(--border);

  border-radius:13px;

  background:var(--surface);

  color:var(--text);

  cursor:pointer;

  transition:
    transform .15s,
    background .15s;
}

.suggestion:hover{
  background:var(--surface-hover);

  transform:translateY(-2px);
}

.suggestion-title{
  font-size:14px;
  font-weight:650;
  margin-bottom:5px;
}

.suggestion-description{
  color:var(--muted);
  font-size:12px;
}

/* =========================================================
   TYPING
========================================================= */

.typing{
  display:flex;
  align-items:center;
  gap:5px;

  padding:8px 0;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--muted);

  animation:
    typing 1.2s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.30s;
}

@keyframes typing{
  0%,80%,100%{
    transform:translateY(0);
    opacity:.3;
  }

  40%{
    transform:translateY(-4px);
    opacity:1;
  }
}

/* =========================================================
   IMAGE RESULT
========================================================= */

.generated-image{
  max-width:100%;

  border-radius:14px;

  margin-top:10px;

  display:block;

  border:1px solid var(--border);

  box-shadow:var(--shadow);
}

/* =========================================================
   SEARCH SOURCES
========================================================= */

.sources{
  margin-top:15px;

  display:flex;
  flex-direction:column;

  gap:6px;
}

.source-title{
  color:var(--muted);

  font-size:11px;

  font-weight:700;

  text-transform:uppercase;
}

.source-link{
  color:var(--accent);

  font-size:12px;

  text-decoration:none;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.source-link:hover{
  text-decoration:underline;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area{
  flex-shrink:0;

  padding:
    8px
    max(15px, calc((100% - 930px) / 2))
    16px;
}

.composer{
  position:relative;

  width:100%;

  background:var(--surface);

  border:
    1px solid var(--border);

  border-radius:17px;

  box-shadow:var(--shadow);

  padding:8px;
}

.attachments{
  display:flex;

  flex-wrap:wrap;

  gap:6px;

  padding:
    3px 5px 7px;
}

.attachment{
  display:flex;
  align-items:center;
  gap:7px;

  max-width:240px;

  background:var(--surface-soft);

  border:
    1px solid var(--border);

  border-radius:9px;

  padding:6px 8px;

  font-size:11px;
}

.attachment-name{
  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.remove-file{
  border:0;

  background:transparent;

  color:var(--muted);

  cursor:pointer;

  font-size:14px;
}

.composer-row{
  display:flex;

  align-items:flex-end;

  gap:4px;
}

.tool{
  flex-shrink:0;

  width:39px;
  height:39px;

  border:0;

  background:transparent;

  color:var(--muted);

  border-radius:9px;

  cursor:pointer;

  font-size:17px;

  transition:.15s;
}

.tool:hover{
  background:var(--surface-hover);

  color:var(--text);
}

.textarea{
  flex:1;

  resize:none;

  border:0;
  outline:0;

  background:transparent;

  color:var(--text);

  font-family:inherit;

  font-size:15px;

  line-height:1.5;

  min-height:40px;

  max-height:180px;

  padding:9px 7px;

  overflow-y:auto;
}

.textarea::placeholder{
  color:var(--muted);
}

.send{
  flex-shrink:0;

  width:40px;
  height:40px;

  border:0;

  border-radius:10px;

  background:var(--accent);

  color:white;

  cursor:pointer;

  font-size:18px;

  transition:.15s;
}

.send:hover:not(:disabled){
  background:var(--accent-hover);

  transform:translateY(-1px);
}

.send:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.composer-info{
  display:flex;

  align-items:center;

  padding:
    4px 5px 0;

  color:var(--muted);

  font-size:10px;
}

.file-info{
  flex:1;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.disclaimer{
  text-align:center;

  font-size:10px;

  color:var(--muted);

  margin-top:7px;
}

/* =========================================================
   MODE / TOOLS
========================================================= */

.mode-bar{
  display:flex;

  align-items:center;

  gap:5px;

  padding:
    0 5px 7px;

  overflow-x:auto;
}

.mode{
  border:
    1px solid var(--border);

  background:var(--surface);

  color:var(--muted);

  border-radius:8px;

  padding:5px 9px;

  font-size:11px;

  cursor:pointer;

  white-space:nowrap;
}

.mode:hover,
.mode.active{
  background:var(--surface-soft);
  color:var(--text);
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.45);

  backdrop-filter:blur(5px);
}

.modal.open{
  display:flex;
}

.modal-box{
  width:
    min(470px,100%);

  background:var(--surface);

  border:
    1px solid var(--border);

  border-radius:17px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.2);

  padding:20px;
}

.modal-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:8px;
}

.modal-header h2{
  font-size:18px;

  margin:0;
}

.modal-close{
  width:34px;
  height:34px;

  border:0;

  background:transparent;

  color:var(--muted);

  border-radius:8px;

  cursor:pointer;

  font-size:20px;
}

.modal-close:hover{
  background:var(--surface-hover);
}

.setting{
  padding:
    14px 0;

  border-bottom:
    1px solid var(--border);
}

.setting:last-child{
  border-bottom:0;
}

.setting label{
  display:block;

  font-size:13px;
  font-weight:600;

  margin-bottom:7px;
}

.setting select{
  width:100%;

  border:
    1px solid var(--border);

  border-radius:9px;

  background:var(--surface);

  color:var(--text);

  padding:9px;

  outline:none;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;

  bottom:25px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  z-index:1000;

  background:#222;

  color:white;

  padding:10px 14px;

  border-radius:9px;

  font-size:12px;

  transition:.25s;
}

.toast.show{
  transform:
    translate(-50%,0);

  opacity:1;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

  .sidebar{
    position:fixed;

    z-index:400;

    left:0;
    top:0;
    bottom:0;

    transform:translateX(-100%);

    box-shadow:
      10px 0 30px rgba(0,0,0,.18);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 10px;
  }

  .top-status{
    display:none;
  }

  .chat{
    padding:
      20px 13px 30px;
  }

  .message{
    margin-bottom:24px;
  }

  .user .message-content{
    max-width:88%;
  }

  .bubble{
    font-size:14px;
  }

  .welcome{
    margin-top:2vh;
    min-height:65vh;
  }

  .welcome h1{
    font-size:27px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .composer-area{
    padding:
      6px 8px 12px;
  }

  .mode-bar{
    padding-bottom:5px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <div class="brand-symbol">
        W
      </div>

      <div class="brand-name">
        Wiener IA
      </div>

    </div>

    <button
      class="new-chat"
      onclick="newChat()">

      ＋ Nouvelle conversation

    </button>

    <div class="history">

      <div class="history-label">
        Conversations
      </div>

      <div id="historyList"></div>

    </div>

    <div class="sidebar-bottom">

      <button
        class="sidebar-button"
        onclick="openSettings()">

        ⚙️
        <span>Paramètres</span>

      </button>

      <button
        class="sidebar-button"
        onclick="toggleTheme()">

        ◐
        <span>Changer le thème</span>

      </button>

      <button
        class="sidebar-button"
        onclick="exportConversation()">

        ⇩
        <span>Exporter</span>

      </button>

      <button
        class="sidebar-button"
        onclick="clearAllHistory()">

        🗑
        <span>Effacer l'historique</span>

      </button>

    </div>

  </aside>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main">

    <header class="topbar">

      <button
        class="mobile-menu"
        onclick="toggleSidebar()">

        ☰

      </button>

      <div class="top-title">
        Wiener IA
      </div>

      <div class="top-status">

        <span class="status-dot"></span>

        <span id="statusText">
          Prêt
        </span>

      </div>

      <div class="top-actions">

        <button
          class="top-button"
          title="Nouvelle conversation"
          onclick="newChat()">

          ＋

        </button>

        <button
          class="top-button"
          title="Paramètres"
          onclick="openSettings()">

          ⚙

        </button>

      </div>

    </header>


    <!-- ===================================================
         CHAT
    ==================================================== -->

    <div
      class="chat"
      id="chat">
    </div>


    <!-- ===================================================
         COMPOSER
    ==================================================== -->

    <div class="composer-area">

      <div class="composer">

        <div
          class="mode-bar"
          id="modeBar">

          <button
            class="mode active"
            onclick="setMode('chat',this)">

            💬 Chat

          </button>

          <button
            class="mode"
            onclick="setMode('search',this)">

            🔎 Recherche

          </button>

          <button
            class="mode"
            onclick="setMode('exercise',this)">

            📚 Exercice

          </button>

          <button
            class="mode"
            onclick="setMode('image',this)">

            ✦ Image

          </button>

        </div>


        <div
          id="attachments"
          class="attachments">
        </div>


        <div class="composer-row">

          <button
            class="tool"
            title="Ajouter un fichier"
            onclick="chooseFile()">

            ＋

          </button>

          <input
            id="fileInput"
            type="file"
            hidden
            multiple
            accept=".pdf,.txt,.csv,.json,.jpg,.jpeg,.png,.webp"
            onchange="handleFiles(event)"
          >


          <button
            class="tool"
            title="Dictée vocale"
            onclick="startVoice()">

            🎤

          </button>


          <textarea
            id="message"
            class="textarea"
            rows="1"
            placeholder="Message à Wiener IA..."
            onkeydown="handleKey(event)"
            oninput="resizeTextarea(this)"
          ></textarea>


          <button
            class="send"
            id="sendButton"
            onclick="sendMessage()"
            title="Envoyer">

            ↑

          </button>

        </div>


        <div class="composer-info">

          <div
            class="file-info"
            id="fileInfo">
          </div>

          <span>
            Entrée pour envoyer · Maj + Entrée pour une nouvelle ligne
          </span>

        </div>

      </div>


      <div class="disclaimer">

        Wiener IA peut faire des erreurs. Vérifiez les informations importantes.

<script>

/* =========================================================
   VARIABLES
========================================================= */

let conversations =
  JSON.parse(
    localStorage.getItem(
      "wiener_conversations"
    ) || "[]"
  );

let currentConversation = null;

let selectedFiles = [];

let currentMode = "chat";

let busy = false;

const sendButton =

const sidebar =

const fileInput =

const attachments =

/* =========================================================
   INITIALISATION
========================================================= */

function init(){

  const theme =
    localStorage.getItem(
      "wiener_theme"
    ) || "light";

  setTheme(theme);

  document.getElementById(
    "languageSelect"

  document.getElementById(
    "autoSpeak"
  ).value =

      "wiener_auto_speak"
    ) || "no";

  if(conversations.length){

    currentConversation =

    renderConversation();

    createConversation();

/* =========================================================
   NOUVELLE CONVERSATION
========================================================= */

function createConversation(){

  currentConversation = {

    id:
      Date.now(),

    title:
      "Nouvelle conversation",

    messages:[]

  };

  conversations.unshift(
    currentConversation
  );

  saveConversations();

}


function newChat(){

  createConversation();

  selectedFiles = [];

  renderAttachments();

  renderHistory();

  renderConversation();

  input.focus();

  closeSidebar();

}


/* =========================================================
   HISTORIQUE
========================================================= */

function renderHistory(){

  const list =
    document.getElementById(
      "historyList"
    );

  list.innerHTML = "";


  conversations.forEach(
    conversation => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item" +
        (
          currentConversation &&
          currentConversation.id === conversation.id
            ? " active"
            : ""
        );


      item.textContent =
        conversation.title ||
        "Conversation";


      item.onclick = () => {

        currentConversation =
          conversation;

        selectedFiles = [];

        renderAttachments();

        renderHistory();

        renderConversation();

        closeSidebar();

      };


      list.appendChild(item);

    }
  );

}


/* =========================================================
   AFFICHAGE CONVERSATION
========================================================= */

function renderConversation(){

  chat.innerHTML = "";


  if(
    !currentConversation ||
    !currentConversation.messages ||
    currentConversation.messages.length === 0
  ){

    renderWelcome();

    return;

  }


  currentConversation.messages.forEach(
    (message,index) => {

      addMessageToScreen(
        message.role,
        message.content,
        index,
        message.sources,
        message.image
      );

    }
  );


  scrollBottom();

}


/* =========================================================
   WELCOME
========================================================= */

function renderWelcome(){

  chat.innerHTML = `

          </div>

        </button>

          </div>

          </div>

}


/* =========================================================
   AJOUT MESSAGE
========================================================= */

function addMessageToScreen(
  role,
  content,
  index,
  sources = [],
  image = null
){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;


  const container =
    document.createElement("div");

  container.className =
    "message-content";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if(role === "assistant"){

    bubble.innerHTML =
      renderMarkdown(content);

  }else{

    bubble.textContent =
      content;

  }


  container.appendChild(
    bubble
  );


  if(image){

    const img =
      document.createElement("img");

    img.className =
      "generated-image";

    img.src =
      image;

    img.alt =
      "Image générée par Wiener IA";

    container.appendChild(img);

  }


  if(
    role === "assistant" &&
    sources &&
    sources.length
  ){

    const sourceContainer =
      document.createElement("div");

    sourceContainer.className =
      "sources";


    const title =
      document.createElement("div");

    title.className =
      "source-title";

    title.textContent =
      "Sources";

    sourceContainer.appendChild(title);


    sources.forEach(
      source => {

        if(!source.url) return;


        const link =
          document.createElement("a");

        link.className =
          "source-link";

        link.href =
          source.url;

        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";

        link.textContent =
          source.title ||
          source.url;


        sourceContainer.appendChild(
          link
        );

      }
    );


    container.appendChild(
      sourceContainer
    );

  }


  if(role === "assistant"){

    const actions =
      document.createElement("div");

    actions.className =
      "actions";


    const copy =
      document.createElement("button");

    copy.className =
      "action";

    copy.title =
      "Copier";

    copy.textContent =
      "📋";

    copy.onclick =
      () => copyText(index);


    const speak =
      document.createElement("button");

    speak.className =
      "action";

    speak.title =
      "Lire";

    speak.textContent =
      "🔊";

    speak.onclick =
      () => speakText(index);


    const regenerateButton =
      document.createElement("button");

    regenerateButton.className =
      "action";

    regenerateButton.title =
      "Régénérer";

    regenerateButton.textContent =
      "↻";

    regenerateButton.onclick =
      () => regenerate(index);


    actions.appendChild(copy);
    actions.appendChild(speak);
    actions.appendChild(
      regenerateButton
    );


    container.appendChild(
      actions
    );

  }


  wrapper.appendChild(
    container
  );


  chat.appendChild(
    wrapper
  );

}


/* =========================================================
   MARKDOWN SIMPLE ET SÉCURISÉ
========================================================= */

function renderMarkdown(text){

  if(!text) return "";


  let safe =
    escapeHTML(text);


  const codeBlocks = [];


  safe =
    safe.replace(
      /```([\s\S]*?)```/g,
      function(match,code){

        const id =
          codeBlocks.length;

        codeBlocks.push(code);

        return `@@CODE_${id}@@`;

      }
    );


  safe =
    safe.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );


  safe =
    safe.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );


  safe =
    safe.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );


  safe =
    safe.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  safe =
    safe.replace(
      /\*(.*?)\*/g,
      "<em>$1</em>"
    );


  safe =
    safe.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  safe =
    safe.replace(
      /^[-•] (.*)$/gm,
      "<li>$1</li>"
    );


  safe =
    safe.replace(
      /(<li>.*<\/li>)/gs,
      "<ul>$1</ul>"
    );


  safe =
    safe.replace(
      /\n{2,}/g,
      "</p><p>"
    );


  safe =
    "<p>" +
    safe +
    "</p>";


  safe =
    safe.replace(
      /<p>\s*(<h[123]>)/g,
      "$1"
    );


  safe =
    safe.replace(
      /(<\/h[123]>)\s*<\/p>/g,
      "$1"
    );


  safe =
    safe.replace(
      /<p>\s*(<ul>)/g,
      "$1"
    );


  safe =
    safe.replace(
      /(<\/ul>)\s*<\/p>/g,
      "$1"
    );


  codeBlocks.forEach(
    (code,index) => {

      const escapedCode =
        code.trim();


      const html = `

        <div class="code-block">

          <div class="code-header">

            <span>Code</span>

            <button
              class="code-copy"
              onclick="copyCode(${index},this)">

              Copier

            </button>

          </div>

          <pre>${escapedCode}</pre>

        </div>

      `;


      safe =
        safe.replace(
          `@@CODE_${index}@@`,
          html
        );

    }
  );


  return safe;

}


let lastCodeBlocks = [];


function copyCode(index,button){

  const block =
    button.closest(
      ".code-block"
    );

  if(!block) return;


  const code =
    block.querySelector(
      "pre"
    )?.textContent || "";


  navigator.clipboard
    .writeText(code)
    .then(
      () => showToast("Code copié")
    )
    .catch(
      () => showToast("Copie impossible")
    );

}


/* =========================================================
   ENVOI PRINCIPAL
========================================================= */

async function sendMessage(){

  if(busy) return;


  const text =
    input.value.trim();


  if(
    !text &&
    selectedFiles.length === 0
  ){

    return;

  }


  if(!currentConversation){

    createConversation();

  }


  if(
    currentConversation.title ===
    "Nouvelle conversation"
  ){

    currentConversation.title =
      text
        ? text.substring(0,45)
        : "Nouvelle conversation";

  }


  busy = true;

  sendButton.disabled = true;

  statusText.textContent =
    "Réflexion...";


  const filesToSend =
    [...selectedFiles];


  if(text){

    currentConversation.messages.push({

      role:"user",

      content:text

    });

  }


  input.value = "";

  resizeTextarea(input);

  renderAttachments();

  saveConversations();

  renderConversation();

  showTyping();


  try{

    let result;


    if(
      currentMode === "search"
    ){

      result =
        await requestSearch(text);

    }

    else if(
      currentMode === "exercise"
    ){

      result =
        await requestExercise(text);

    }

    else if(
      currentMode === "image"
    ){

      result =
        await requestImage(text);

    }

    else if(
      filesToSend.length
    ){

      result =
        await requestFiles(
          filesToSend,
          text
        );

    }

    else{

      result =
        await requestChat();

    }


    hideTyping();


    if(!result || !result.answer){

      throw new Error(
        "Wiener IA n'a retourné aucune réponse."
      );

    }


    currentConversation.messages.push({

      role:"assistant",

      content:
        result.answer,

      sources:
        result.sources || [],

      image:
        result.image || null

    });


    saveConversations();

    renderConversation();


    if(
      localStorage.getItem(
        "wiener_auto_speak"
      ) === "yes"
    ){

      speakContent(
        result.answer
      );

    }


  }catch(error){

    hideTyping();


    currentConversation.messages.push({

      role:"assistant",

      content:
        "❌ " +
        (
          error.message ||
          "Une erreur est survenue."
        )

    });


    saveConversations();

    renderConversation();

  }


  selectedFiles = [];

  renderAttachments();


  busy = false;

  sendButton.disabled = false;

  statusText.textContent =
    "Prêt";

  input.focus();

}


/* =========================================================
   CHAT API
========================================================= */

async function requestChat(){

  const response =
    await fetch(
      "/api/chat",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          messages:
            currentConversation.messages

        })

      }
    );


  return readResponse(
    response
  );

}


/* =========================================================
   RECHERCHE
========================================================= */

async function requestSearch(
  query
){

  if(!query){

    throw new Error(
      "Écris une question à rechercher."
    );

  }


  const response =
    await fetch(
      "/api/search",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          query

        })

      }
    );


  return readResponse(
    response
  );

}


/* =========================================================
   EXERCICE
========================================================= */

async function requestExercise(
  question
){

  if(!question){

    throw new Error(
      "Écris l'exercice à résoudre."
    );

  }


  const response =
    await fetch(
      "/api/exercises",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          question,

          level:
            "Terminale",

          subject:
            "non précisée"

        })

      }
    );


  return readResponse(
    response
  );

}


/* =========================================================
   IMAGE
========================================================= */

async function requestImage(
  prompt
){

  if(!prompt){

    throw new Error(
      "Décris l'image que tu veux créer."
    );

  }


  const response =
    await fetch(
      "/api/image",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          prompt

        })

      }
    );


  return readResponse(
    response
  );

}


/* =========================================================
   FICHIERS
========================================================= */

async function requestFiles(
  files,
  prompt
){

  const file =
    files[0];


  if(
    files.length > 1
  ){

    throw new Error(
      "Pour l'analyse, sélectionne un seul fichier à la fois."
    );

  }


  if(
    file.size >
    30 * 1024 * 1024
  ){

    throw new Error(
      "Le fichier dépasse la limite de 30 MB."
    );

  }


  const base64 =
    await fileToBase64(
      file
    );


  const response =
    await fetch(
      "/api/analyze-file",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          file:base64,

          mimeType:
            file.type ||
            guessMimeType(
              file.name
            ),

          prompt:
            prompt ||
            "Analyse ce fichier et explique clairement les informations importantes."

        })

      }
    );


  return readResponse(
    response
  );

}


/* =========================================================
   RÉPONSE HTTP
========================================================= */

async function readResponse(
  response
){

  let data;


  try{

    data =
      await response.json();

  }catch{

    throw new Error(
      "Le serveur a renvoyé une réponse invalide."
    );

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      `Erreur serveur (${response.status}).`
    );

  }


  return data;

}


/* =========================================================
   REGENERATION
========================================================= */

async function regenerate(
  index
){

  if(busy) return;


  if(
    !currentConversation ||
    !currentConversation.messages[index]
  ){

    return;

  }


  if(
    currentConversation.messages[index].role !==
    "assistant"
  ){

    return;

  }


  currentConversation.messages =
    currentConversation.messages.slice(
      0,
      index
    );


  saveConversations();

  renderConversation();

  showTyping();


  busy = true;

  sendButton.disabled = true;

  statusText.textContent =
    "Régénération...";


  try{

    const result =
      await requestChat();


    hideTyping();


    if(!result.answer){

      throw new Error(
        "Réponse vide."
      );

    }


    currentConversation.messages.push({

      role:"assistant",

      content:
        result.answer

    });


    saveConversations();

    renderConversation();


  }catch(error){

    hideTyping();


    currentConversation.messages.push({

      role:"assistant",

      content:
        "❌ " +
        error.message

    });


    saveConversations();

    renderConversation();

  }


  busy = false;

  sendButton.disabled = false;

  statusText.textContent =
    "Prêt";

}


/* =========================================================
   TYPING
========================================================= */

function showTyping(){

  hideTyping();


  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.id =
    "typing";

  wrapper.className =
    "message assistant";


  wrapper.innerHTML = `

    <div class="message-content">

      <div class="typing">

        <span class="dot"></span>

        <span class="dot"></span>

        <span class="dot"></span>

      </div>

    </div>

  `;


  chat.appendChild(
    wrapper
  );


  scrollBottom();

}


function hideTyping(){

  const typing =
    document.getElementById(
      "typing"
    );

  if(typing){

    typing.remove();

  }

}


/* =========================================================
   COPIE
========================================================= */

async function copyText(
  index
){

  const message =
    currentConversation?.messages[index];


  if(!message) return;


  try{

    await navigator.clipboard.writeText(
      message.content
    );

    showToast(
      "Réponse copiée"
    );

  }catch{

    showToast(
      "Impossible de copier"
    );

  }

}


/* =========================================================
   VOIX
========================================================= */

function speakText(
  index
){

  const message =
    currentConversation?.messages[index];


  if(!message) return;


  speakContent(
    message.content
  );

}


function speakContent(
  text
){

  if(
    !("speechSynthesis" in window)
  ){

    showToast(
      "Lecture vocale indisponible"
    );

    return;

  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    document.getElementById(
      "languageSelect"
    ).value;


  utterance.rate =
    .95;


  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   DICTÉE
========================================================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    showToast(
      "Dictée vocale indisponible sur ce navigateur."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    document.getElementById(
      "languageSelect"
    ).value;


  recognition.interimResults =
    false;

  recognition.continuous =
    false;


  statusText.textContent =
    "Écoute...";


  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0]
          .transcript;


      input.value +=
        (
          input.value
            ? " "
            : ""
        ) +
        transcript;


      resizeTextarea(
        input
      );


      statusText.textContent =
        "Prêt";

    };


  recognition.onerror =
    () => {

      statusText.textContent =
        "Prêt";

      showToast(
        "Erreur de dictée"
      );

    };


  recognition.onend =
    () => {

      statusText.textContent =
        "Prêt";

    };


  recognition.start();

}


/* =========================================================
   FICHIERS
========================================================= */

function chooseFile(){

  fileInput.click();

}


function handleFiles(
  event
){

  const files =
    Array.from(
      event.target.files
    );


  if(!files.length) return;


  selectedFiles =
    files.slice(0,1);


  renderAttachments();


  fileInput.value = "";

}


function renderAttachments(){

  attachments.innerHTML = "";


  selectedFiles.forEach(
    (file,index) => {

      const element =
        document.createElement(
          "div"
        );

      element.className =
        "attachment";


      element.innerHTML = `

        <span>
          📎
        </span>

        <span class="attachment-name">
          ${escapeHTML(file.name)}
        </span>

        <button
          class="remove-file"
          onclick="removeFile(${index})">

          ×

        </button>

      `;


      attachments.appendChild(
        element
      );

    }
  );


  const info =
    document.getElementById(
      "fileInfo"
    );


  if(selectedFiles.length){

    info.textContent =
      selectedFiles[0].name;

  }else{

    info.textContent =
      "";

  }

}


function removeFile(
  index
){

  selectedFiles.splice(
    index,
    1
  );


  renderAttachments();

}


function fileToBase64(
  file
){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "Impossible de lire le fichier."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


function guessMimeType(
  filename
){

  const ext =
    filename
      .split(".")
      .pop()
      .toLowerCase();


  const types = {

    pdf:
      "application/pdf",

    png:
      "image/png",

    jpg:
      "image/jpeg",

    jpeg:
      "image/jpeg",

    webp:
      "image/webp",

    txt:
      "text/plain",

    csv:
      "text/csv",

    json:
      "application/json"

  };


  return (
    types[ext] ||
    "application/octet-stream"
  );

}

/* =========================================================
   EXPORT
========================================================= */

function exportConversation(){

  if(
    !currentConversation ||
    !currentConversation.messages.length
  ){

    showToast(
      "Conversation vide"
    );

    return;

  }


  let content =
    "# " +
    currentConversation.title +
    "\n\n";


  currentConversation.messages.forEach(
    message => {

      const author =
        message.role === "user"
          ? "Vous"
          : "Wiener IA";


      content +=
        "## " +
        author +
        "\n\n" +
        message.content +
        "\n\n";

    }
  );


  const blob =
    new Blob(
      [content],
      {
        type:
          "text/markdown;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    (
      currentConversation.title
        .replace(
          /[^a-z0-9]/gi,
          "_"
        ) ||
      "wiener_conversation"
    ) +
    ".md";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(
    url
  );


  showToast(
    "Conversation exportée"
  );

}

  );

}

========================================================= */

let toastTimer = null;


function showToast(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
  text
){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
